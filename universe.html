<style>
:root{
  --bg:#111117;--panel:#18181d;--line:#27272a;--line-soft:#1f1f25;
  --cyan:#00ffff;--cyan-dim:#00c9c9;--text:#fafafa;--text-2:#a8aab8;
  --dim:#6b6d7c;--up:#3ddc84;--down:#ff6b6b;--noodle-y:#fcd14f;--noodle-o:#ef9530;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#06070c;color:var(--text);overflow:hidden;
  font-family:'Work Sans','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
  display:flex;flex-direction:column;
}
a{color:inherit}
.topbar{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 16px 11px;border-bottom:1px solid var(--line);background:rgba(17,17,23,.9)}
.wordmark{font-weight:700;font-size:15px;letter-spacing:.14em;color:var(--cyan);text-decoration:none;display:flex;align-items:center;gap:8px}
.toplinks{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.toplinks a,#langBtn{
  font-family:inherit;font-weight:500;font-size:12px;letter-spacing:.02em;cursor:pointer;
  color:var(--text-2);text-decoration:none;background:transparent;
  border:1px solid var(--line);border-radius:6px;padding:5px 11px;
  transition:border-color .15s,color .15s,background .15s;
}
.toplinks a:hover,#langBtn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,255,255,.06)}
#langBtn{color:var(--cyan);border-color:rgba(0,255,255,.35)}
.secnav{flex:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  padding:8px 12px;border-bottom:1px solid var(--line);background:rgba(17,17,23,.9)}
.secnav a.tab{
  font-weight:500;font-size:12px;letter-spacing:.02em;color:var(--text-2);text-decoration:none;
  border:1px solid var(--line);border-radius:6px;padding:5px 11px;white-space:nowrap;
  transition:border-color .15s,color .15s,background .15s;
}
.secnav a.tab:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,255,255,.06)}
.secnav a.tab.on{color:var(--cyan);border-color:rgba(0,255,255,.5);background:rgba(0,255,255,.08);font-weight:600}
/* ---- the sky ---- */
#stage{flex:1;position:relative;min-height:0;background:#06070c;overflow:hidden}
#uv,#flat{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#uv[hidden],#flat[hidden]{display:none}
#uv.grabbing{cursor:grabbing}
#uv.aim{cursor:pointer}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#sticks{position:absolute;top:0;right:0;width:150px;height:150px;cursor:pointer;opacity:.85;transition:opacity .2s}
#sticks:hover{opacity:1}
#sticks.rest{opacity:.62}
/* ---- the eye of the universe: search ---- */
.uvsearch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(430px,calc(100% - 24px));z-index:6}
.uvs-in{display:flex;gap:7px}
#uq{flex:1;min-width:0;font-family:inherit;font-size:12.5px;color:var(--text);
  background:rgba(17,17,23,.85);border:1px solid var(--line);border-radius:7px;padding:8px 12px}
#uq:focus{outline:none;border-color:var(--cyan)}
#uq::placeholder{color:var(--dim)}
#uqGo{flex:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--cyan);cursor:pointer;
  background:rgba(0,255,255,.07);border:1px solid rgba(0,255,255,.45);border-radius:7px;padding:8px 15px}
#uqGo:hover{background:rgba(0,255,255,.13)}
#uqGo[disabled]{opacity:.5;cursor:wait}
.uvs-msg{margin-top:6px;font-size:10.5px;color:var(--dim);text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.uvs-msg.err{color:var(--down)}
#upick[hidden]{display:none}
#upick{margin-top:6px;display:flex;flex-direction:column;gap:4px;background:rgba(17,17,23,.95);
  border:1px solid var(--line);border-radius:8px;padding:6px;max-height:220px;overflow:auto}
#upick button{display:flex;justify-content:space-between;gap:8px;font-family:inherit;font-size:12px;
  color:var(--text);background:transparent;border:1px solid transparent;border-radius:6px;
  padding:6px 9px;cursor:pointer;text-align:left}
#upick button:hover{border-color:var(--cyan);color:var(--cyan)}
#upick button span{color:var(--dim);font-size:10.5px;white-space:nowrap}
/* ---- the dossier panel ---- */
#panel{position:absolute;top:12px;right:12px;bottom:12px;width:min(372px,calc(100% - 24px));z-index:7;
  display:flex;flex-direction:column;background:rgba(17,17,23,.93);border:1px solid var(--line);
  border-radius:12px;overflow:hidden}
#panel[hidden]{display:none}
.pn-h{flex:none;display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line-soft)}
.pn-av{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#111117;background:var(--noodle-y)}
.pn-av.cy{background:var(--cyan)}
.pn-av.gh{background:#8f7ff0}
.pn-t{flex:1;min-width:0}
.pn-t b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-t i{display:block;font-style:normal;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.pn-t i:hover{color:var(--cyan)}
#pnX{flex:none;width:26px;height:26px;font-size:15px;color:var(--dim);background:transparent;
  border:1px solid var(--line);border-radius:6px;cursor:pointer;line-height:1}
#pnX:hover{color:var(--text);border-color:var(--text-2)}
.pn-chips{flex:none;display:flex;flex-wrap:wrap;gap:5px;padding:9px 12px 0}
.chip{font-size:9.5px;font-weight:700;letter-spacing:.07em;padding:3px 8px;border-radius:5px;border:1px solid}
.chip.gold{color:var(--noodle-y);border-color:rgba(252,209,79,.5);background:rgba(252,209,79,.08)}
.chip.cyan{color:var(--cyan);border-color:rgba(0,255,255,.4);background:rgba(0,255,255,.06)}
.chip.grn{color:var(--up);border-color:rgba(61,220,132,.4);background:rgba(61,220,132,.07)}
.chip.dim{color:var(--text-2);border-color:var(--line)}
.pn-b{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 14px}
.pn-sec{margin-top:12px}
.pn-sec:first-child{margin-top:2px}
.pn-sec h3{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--dim);margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:11px;font-variant-numeric:tabular-nums}
.kv span{color:var(--dim);white-space:nowrap}
.kv b{font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv b.addr{cursor:pointer;color:var(--text-2);font-size:10px}
.kv b.addr:hover{color:var(--cyan)}
.trow{display:flex;align-items:baseline;gap:7px;font-size:11px;font-variant-numeric:tabular-nums;
  padding:3.5px 0;border-bottom:1px solid var(--line-soft)}
.trow:last-child{border-bottom:0}
.trow .tlogo{width:15px;height:15px;border-radius:50%;flex:none;background:#232329;align-self:center}
.trow b{flex:none;min-width:56px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
.trow i{flex:1;font-style:normal;color:var(--dim);font-size:10px;text-align:right;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.trow em{flex:none;font-style:normal;font-weight:700;text-align:right;min-width:58px}
.up{color:var(--up)}.dn{color:var(--down)}.fl{color:var(--text-2)}
.pn-note{margin-top:5px;font-size:9.5px;color:var(--dim);line-height:1.5}
.pn-sum{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;
  font-variant-numeric:tabular-nums;padding:5px 0 2px}
.pn-sum span{color:var(--text-2);font-weight:500}
.rrow{display:flex;align-items:center;gap:7px;font-size:11px;padding:4px 0;border-bottom:1px solid var(--line-soft);
  cursor:pointer}
.rrow:last-child{border-bottom:0}
.rrow:hover b{color:var(--cyan)}
.rrow .dir{flex:none;font-size:9px;font-weight:800;width:28px;text-align:center;border-radius:4px;padding:2px 0}
.rrow .dir.in{color:var(--up);background:rgba(61,220,132,.1)}
.rrow .dir.out{color:var(--noodle-o);background:rgba(239,149,48,.12)}
.rrow .dir.ref{color:var(--text-2);background:rgba(168,170,184,.1)}
.rrow b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.rrow i{flex:none;font-style:normal;color:var(--dim);font-size:10px}
.pn-act{display:flex;gap:7px;margin-top:13px}
.pn-act a,.pn-act button{flex:1;font-family:inherit;font-size:11.5px;font-weight:600;text-align:center;
  color:var(--cyan);text-decoration:none;background:rgba(0,255,255,.06);cursor:pointer;
  border:1px solid rgba(0,255,255,.4);border-radius:7px;padding:8px 4px}
.pn-act a:hover,.pn-act button:hover{background:rgba(0,255,255,.12)}
.pn-load{font-size:10.5px;color:var(--dim);padding:4px 0}
/* ---- money in flight: the only panel that shouts ---- */
.fl-sec{margin-top:2px;margin-bottom:12px;border:1px solid rgba(252,209,79,.34);border-radius:9px;
  background:rgba(252,209,79,.055);padding:8px 9px}
.fl-sec.calm{border-color:var(--line);background:rgba(255,255,255,.02)}
.fl-h{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.fl-h h3{flex:1;min-width:0;font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--noodle-y)}
.fl-sec.calm .fl-h h3{color:var(--dim)}
.fl-h button{flex:none;font-family:inherit;font-size:9.5px;color:var(--text-2);background:transparent;
  border:1px solid var(--line);border-radius:5px;padding:2px 7px;cursor:pointer}
.fl-h button:hover{color:var(--cyan);border-color:var(--cyan)}
.fl-h button[disabled]{opacity:.5;cursor:wait}
.fl-row{padding:5px 0;border-bottom:1px solid var(--line-soft)}
.fl-row:last-of-type{border-bottom:0}
.fl-top{display:flex;align-items:baseline;gap:7px;font-size:11.5px;font-variant-numeric:tabular-nums}
.fl-tag{flex:none;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px}
.fl-tag.in{color:var(--up);background:rgba(61,220,132,.12)}
.fl-tag.out{color:var(--noodle-o);background:rgba(239,149,48,.14)}
.fl-top b{flex:none;font-weight:700}
.fl-top em{flex:1;min-width:0;font-style:normal;font-size:10px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-top a{flex:none;font-size:9.5px;color:var(--cyan);text-decoration:none;opacity:.85}
.fl-top a:hover{opacity:1;text-decoration:underline}
.fl-st{margin-top:2px;font-size:10px;line-height:1.5;color:var(--text-2)}
.fl-st.warn{color:var(--noodle-y)}
.fl-net{margin-top:1px;font-size:9.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.fl-foot{margin-top:6px;font-size:9.5px;line-height:1.55;color:var(--dim)}
.fl-foot b{color:var(--text-2);font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:1200px){
  /* the dossier owns the right edge; the eye moves out of its way */
  .uvsearch{left:12px;transform:none;width:min(380px,calc(100% - 24px))}
}
@media (max-width:640px){
  .uvsearch{top:8px}
  #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:64vh}
}
/* ---- the plaque ---- */
.plaque{position:absolute;top:62px;left:16px;max-width:340px;pointer-events:none}
.plaque h1{font-size:21px;font-weight:800;letter-spacing:.16em;color:var(--text);text-shadow:0 0 18px rgba(0,0,0,.9)}
.plaque .sub{margin-top:6px;font-size:11.5px;line-height:1.6;color:var(--text-2);text-shadow:0 1px 8px rgba(0,0,0,.9)}
.stats{margin-top:11px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;pointer-events:auto}
.stat{background:rgba(17,17,23,.78);border:1px solid var(--line);border-radius:8px;padding:7px 10px 6px}
.stat i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.stat b{display:block;margin-top:2px;font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.gray b{color:#9a9dab}
.stat.lit b{color:var(--cyan)}
.stat.gold b{color:var(--noodle-y)}
.stat .liv{display:inline-block;margin-left:5px;font-size:8.5px;font-weight:600;letter-spacing:.06em;color:var(--up);vertical-align:2px}
.stat .liv[hidden]{display:none}
.foot{margin-top:8px;font-size:9.5px;color:var(--dim);line-height:1.5;text-shadow:0 1px 6px rgba(0,0,0,.9)}
/* ---- the legend ---- */
.key{position:absolute;left:16px;bottom:14px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.key .k{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text-2);text-shadow:0 1px 6px rgba(0,0,0,.9)}
.key .dot{width:8px;height:8px;border-radius:50%;flex:none}
.key .dot.g{background:#565a68}
.key .dot.c{background:var(--cyan);box-shadow:0 0 7px rgba(0,255,255,.8)}
.key .dot.n{background:var(--noodle-y);box-shadow:0 0 8px rgba(252,209,79,.9)}
.hint{position:absolute;right:14px;bottom:14px;font-size:10px;color:var(--dim);text-align:right;
  line-height:1.6;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.9)}
/* ---- the name card ---- */
#tip{position:absolute;display:none;pointer-events:none;z-index:5;
  background:rgba(17,17,23,.92);border:1px solid rgba(252,209,79,.45);border-radius:8px;
  padding:8px 11px;max-width:250px}
#tip b{display:block;font-size:12px;color:var(--noodle-y);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tip span{display:block;margin-top:2px;font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums}
#tip em{display:block;margin-top:4px;font-style:normal;font-size:9.5px;color:var(--dim)}
#nogl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;
  font-size:12px;color:var(--dim);text-align:center;line-height:1.7}
@media (max-width:640px){
  .plaque{max-width:230px;top:56px}
  .plaque h1{font-size:16px;letter-spacing:.12em}
  .plaque .sub{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .stat{padding:5px 8px 4px}
  .stat b{font-size:12.5px}
  .foot{display:none}
  .hint{display:none}
  #sticks{width:96px;height:96px;opacity:.6}
  .key{gap:3px}
  .key .k{font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){
  /* the sky holds still; JS reads this too */
}
</style>

<script>
'use strict';
const $=s=>document.querySelector(s);

/* ================= baked census =================
   Rebaked offline every so often: tools/README notes the recipe. The gold

/* ================= seeded dust ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=(h*33)^s.charCodeAt(i);return h>>>0;}

/* ================= the bowl, laid out in points =================
   World units: rim radius 100, y up. Everything is one additive point
   cloud — the bowl itself is spun from the same starlight as the sky. */
const R=100,ARMS=4,TWIST=3.4*Math.PI; /* each arm winds 1.7 turns */
function armPoint(rnd,t){
  /* a spot on one of the four noodle arms at progress t (0 core, 1 rim) */
  const arm=(rnd()*ARMS)|0;
  const g1=(rnd()+rnd()+rnd())/1.5-1, g2=(rnd()+rnd()+rnd())/1.5-1, g3=(rnd()+rnd()+rnd())/1.5-1;
  const r=8+t*(R-24)+g1*(4.5+t*4);
  const th=t*TWIST+arm*(Math.PI*2/ARMS)+g2*(0.10+0.05*(1-t));
  return [Math.cos(th)*r, -4.2+g3*(1.7+1.4*(1-t*0.5)), Math.sin(th)*r];
}
function buildStatic(){
  const G=UD.v1, A=UD_ACT.length;
  const N_BOWL=15000,N_RIM=8000,N_BLUE=2600,N_SOUP=12000,N_CORE=15000,N_SKY=3000,N_FOOT=2200;
  const total=G+A+N_BOWL+N_RIM+N_BLUE+N_SOUP+N_CORE+N_SKY+N_FOOT;
  const buf=new ArrayBuffer(total*24);
  const F=new Float32Array(buf),B=new Uint8Array(buf);
  let n=0;
  function put(x,y,z,s,r,g,b,a,h){
    const o=n*6,ob=n*24+16;
    F[o]=x;F[o+1]=y;F[o+2]=z;F[o+3]=s;
    B[ob]=r;B[ob+1]=g;B[ob+2]=b;B[ob+3]=a;
    F[o+5]=h;
    n++;
  }
  const rnd=mulberry32(20260827);
  /* legacy dust — every one of them; a sixth drifts loose between the arms.
     The i-th mote IS the i-th citizen of /v1/users: click one, and the
     archive is asked who lives there. */
  DUST.pos=new Float32Array(G*3);
  for(let i=0;i<G;i++){
    let p;
    if(rnd()<0.15){
      const a=rnd()*Math.PI*2, rr=8+Math.pow(rnd(),0.8)*(R-24);
      p=[Math.cos(a)*rr,-4.2+((rnd()+rnd()+rnd())/1.5-1)*2.2,Math.sin(a)*rr];
    }else p=armPoint(rnd,Math.pow(rnd(),0.74));
    DUST.pos[i*3]=p[0];DUST.pos[i*3+1]=p[1];DUST.pos[i*3+2]=p[2];
    put(p[0],p[1],p[2],0.68+rnd()*0.4, 80,84,96, 28, 1+rnd()*0.9); /* rock */
  }
  /* the living, lit cyan — every one a real, clickable address */
  for(let i=0;i<A;i++){
    const h=hashStr(UD_ACT[i]);
    const p=hashPos(UD_ACT[i]);
    put(p[0],p[1],p[2],1.35+((h>>>6&255)/255)*0.75, 0,229,229, 165, 2+((h&1023)/1023)*0.9); /* ocean */
  }
  /* golden core — the swirl the noodles wind out of */
  for(let i=0;i<N_CORE;i++){
    const a=rnd()*Math.PI*2, rr=Math.pow(rnd(),1.6)*10.5, yy=-4+((rnd()+rnd())-1)*3;
    const heat=1-rr/11;
    put(Math.cos(a)*rr,yy,Math.sin(a)*rr,0.8+rnd()*0.9,
      252, Math.round(160+60*heat), Math.round(40+40*heat), 120, rnd()*0.9);
  }
  /* soup — a dark blue hush under everything */
  for(let i=0;i<N_SOUP;i++){
    const a=rnd()*Math.PI*2, rr=Math.sqrt(rnd())*(R-8);
    put(Math.cos(a)*rr,-6.5-2.5*(1-(rr/R)*(rr/R))+((rnd()-0.5)*1.6),Math.sin(a)*rr,
      1.1, 22,64,111, 46, rnd()*0.9);
  }
  /* bowl wall — cream shell falling away below the rim */
  for(let i=0;i<N_BOWL;i++){
    const yy=-Math.pow(rnd(),1.12)*54-0.5;
    const pr=Math.sqrt(Math.max(0.02,1-((yy+6)/62)*((yy+6)/62)));
    const a=rnd()*Math.PI*2, rr=pr*R*(0.985+rnd()*0.02);
    const sh=1+yy/95;
    put(Math.cos(a)*rr,yy,Math.sin(a)*rr,0.85,
      Math.round(233*sh),Math.round(217*sh),Math.round(192*sh), 62, rnd()*0.9);
  }
  /* rim — the bright lip that says "bowl" */
  for(let i=0;i<N_RIM;i++){
    const a=rnd()*Math.PI*2;
    const g=(rnd()+rnd())-1;
    put(Math.cos(a)*(R+g*1.9),((rnd()+rnd())-1)*1.5,Math.sin(a)*(R+g*1.9),
      1.05, 240,226,203, 105, rnd()*0.9);
  }
  /* one thin blue accent ring just inside the lip */
  for(let i=0;i<N_BLUE;i++){
    const a=rnd()*Math.PI*2;
    put(Math.cos(a)*(R-5+((rnd()-0.5)*1.4)),-1+((rnd()-0.5)*1.1),Math.sin(a)*(R-5+((rnd()-0.5)*1.4)),
      0.95, 63,127,217, 92, rnd()*0.9);
  }
  /* the foot the bowl stands on */
  for(let i=0;i<N_FOOT;i++){
    const a=rnd()*Math.PI*2, rr=34+rnd()*4;
    put(Math.cos(a)*rr,-55-rnd()*5,Math.sin(a)*rr,0.9, 196,180,156, 52, rnd()*0.9);
  }
  /* far stars, so turning the bowl turns the sky */
  for(let i=0;i<N_SKY;i++){
    const u=rnd()*2-1, a=rnd()*Math.PI*2, s=Math.sqrt(1-u*u);
    const cold=rnd()<0.3;
    put(Math.cos(a)*s*520,u*520,Math.sin(a)*s*520,2.2+rnd()*2,
      cold?150:255,cold?230:255,cold?255:245, 90, rnd()*0.9);
  }
  return {buf,count:n};
}

/* ================= the gold stars + planets (dynamic) ================= */
const gold={list:[],px:[],pos:[],hash:[],buf:null,count:0,max:1};
function goldPrep(){
  /* rank decides the orbit: whales sit close to the core */
  gold.pos.length=gold.hash.length=gold.px.length=gold.list.length;
  gold.max=gold.list.length?(gold.list[0][2]||1):1;
  for(let i=0;i<gold.list.length;i++){
    const h=hashStr(gold.list[i][0]);
    const t=0.06+0.82*Math.pow((i+0.5)/gold.list.length,0.62);
    const th=t*TWIST+(h%ARMS)*(Math.PI*2/ARMS)+((h>>>4&255)/255-0.5)*0.14;
    const r=8+t*(R-24)+((h>>>12&255)/255-0.5)*5;
    gold.hash[i]=(h&1023)/1023;
    gold.pos[i]=[Math.cos(th)*r,-3.2+((h>>>20&255)/255-0.5)*2.6,Math.sin(th)*r];
  }
}
/* ================= the census register =================
   Every star with a name lives here: gold (NOODL), pulsing chefs (LP),
   cyan (still holding anything), and ghosts (addresses that only exist
   because someone's money trail points at them). */
function hashPos(p){
  const h=hashStr(p);
  const t=0.08+0.86*Math.pow((h>>>8&65535)/65535,0.8);
  const th=t*TWIST+(h%ARMS)*(Math.PI*2/ARMS)+((h>>>4&255)/255-0.5)*0.16;
  const r=8+t*(R-24)+((h>>>16&255)/255-0.5)*5;
  return [Math.cos(th)*r,-4+((h>>>24&127)/127-0.5)*2.8,Math.sin(th)*r];
}
const CHEF={list:UD_CHEFS.slice(),set:new Set(UD_CHEFS.map(c=>c[0]))};
const DUST={pos:null,cache:new Map()};
const GHOSTS=[];
const REG={list:[],map:new Map()};
let dynDirty=false;
function regBuild(){
  /* names learned along the way survive the rebuild */
  const names=new Map();
  for(const o of REG.list)if(o.name)names.set(o.p,o.name);
  REG.list.length=0;REG.map.clear();
  function reg(o){
    if(REG.map.has(o.p))return;
    if(!o.name&&names.has(o.p))o.name=names.get(o.p);
    o.hash=(hashStr(o.p)&1023)/1023;REG.map.set(o.p,o);REG.list.push(o);
  }
  for(let i=0;i<gold.list.length;i++)
    reg({p:gold.list[i][0],kind:'gold',pos:gold.pos[i],name:gold.list[i][1],bal:gold.list[i][2],
      chef:CHEF.set.has(gold.list[i][0])});
  for(const c of CHEF.list)
    reg({p:c[0],kind:'chef',pos:hashPos(c[0]),name:c[1],chef:true});
  for(const p of UD_ACT)reg({p,kind:'cyan',pos:hashPos(p)});
  for(const g2 of GHOSTS)reg({p:g2.p,kind:'ghost',pos:g2.pos,name:g2.name});
  dynDirty=true;
}
function ensureStar(p){
  if(REG.map.has(p))return REG.map.get(p);
  GHOSTS.push({p,pos:hashPos(p)});
  regBuild();
  return REG.map.get(p);
}

const PLANETS=[
  {r:36,sp:0.11,a0:0.7,c:[55,214,195],s:5.2,k:2},   /* teal ocean */
  {r:57,sp:0.074,a0:2.6,c:[252,209,79],s:6.2,k:3},  /* small gold sun */
  {r:74,sp:0.052,a0:4.4,c:[239,149,48],s:5.6,k:1},  /* baked rock */
  {r:90,sp:0.038,a0:5.6,c:[122,168,255],s:4.6,k:2}  /* blue ocean */
];
const RINGN=46;
function buildDyn(time){
  const NG=gold.list.length, NP=PLANETS.length*(2+RINGN);
  const NX=CHEF.list.length+GHOSTS.length; /* upper bound for chef strays + ghosts */
  const buf=new ArrayBuffer((NG+NP+NX)*24);
  const F=new Float32Array(buf),B=new Uint8Array(buf);
  let n=0;
  function put(x,y,z,s,r,g,b,a,h){
    const o=n*6,ob=n*24+16;
    F[o]=x;F[o+1]=y;F[o+2]=z;F[o+3]=s;
    B[ob]=r;B[ob+1]=g;B[ob+2]=b;B[ob+3]=a;F[o+5]=h;n++;
  }
  /* the pool decides how big a chef burns */
  const lpMap=new Map(CHEF.list.map(c=>[c[0],c[2]||0]));
  const lpMax=CHEF.list.length?Math.max(1,CHEF.list[0][2]||1):1;
  for(let i=0;i<NG;i++){
    const p=gold.pos[i],w=Math.pow(gold.list[i][2]/gold.max,0.4);
    let s=2.1+4.6*w, kind=3;
    if(lpMap.has(gold.list[i][0])){
      /* a chef: sized by their share of the pool, spinning even when
         the rest of the sky stands still (kind 4) */
      kind=4;
      s=3.2+5.4*Math.sqrt((lpMap.get(gold.list[i][0])||1)/lpMax);
      s*=1+0.14*Math.sin(time*2.6+gold.hash[i]*40);
    }
    put(p[0],p[1],p[2],s,
      252,Math.round(172+50*w),Math.round(140-90*w),225,kind+gold.hash[i]*0.9);
  }
  const gset=new Set(gold.list.map(r=>r[0]));
  for(const c of CHEF.list){
    if(gset.has(c[0]))continue;
    const p=hashPos(c[0]),h=(hashStr(c[0])&1023)/1023;
    const s=(3.2+5.4*Math.sqrt((c[2]||1)/lpMax))*(1+0.14*Math.sin(time*2.6+h*40));
    put(p[0],p[1],p[2],s,255,236,190,225,4+h*0.9);
  }
  for(const g2 of GHOSTS){
    const h=(hashStr(g2.p)&1023)/1023;
    put(g2.pos[0],g2.pos[1],g2.pos[2],2.4,151,133,240,210,h*0.9);
  }
  for(const pl of PLANETS){
    const a=pl.a0+time*pl.sp;
    const x=Math.cos(a)*pl.r,z=Math.sin(a)*pl.r,y=-1.5;
    put(x,y,z,pl.s,pl.c[0],pl.c[1],pl.c[2],210,pl.k+0.35);
    /* a hot core, or the additive haze reads as a hole in the dust */
    put(x,y,z,pl.s*0.5,Math.min(255,pl.c[0]+95),Math.min(255,pl.c[1]+95),Math.min(255,pl.c[2]+95),255,0.35);
    for(let k=0;k<RINGN;k++){ /* the white ring the logo planets wear */
      const b=k/RINGN*Math.PI*2, rr=pl.s*0.95;
      put(x+Math.cos(b)*rr,y+Math.sin(b)*rr*0.38,z+Math.sin(b)*rr*0.75,
        0.62,255,255,255,120,(k/RINGN)*0.9);
    }
  }
  return {buf,count:n};
}

function shader(type,src){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  return s;
}
function glInit(){
  /* aH carries two things at once: floor() is the world's KIND
     (0 dust/soft glow, 1 rock, 2 ocean, 3 burning sun), fract() its phase */
  const vs=shader(gl.VERTEX_SHADER,
    'attribute vec3 aP;attribute float aS;attribute vec4 aC;attribute float aH;'+
    'uniform mat4 uM;uniform float uT;uniform float uPx;uniform float uFog;'+
    'varying vec4 vC;varying float vK;varying float vPx;varying float vSd;varying float vF;'+
    'void main(){vec4 p=uM*vec4(aP,1.0);gl_Position=p;'+
    'float w=max(p.w,0.001);'+
    'float px=clamp(aS*uPx/w,0.75,200.0);'+
    'gl_PointSize=px;'+
    'float k=floor(aH+0.001);float ph=fract(aH);'+
    'float tw=0.74+0.26*sin(uT*(0.5+ph*1.9)+ph*47.0);'+
    /* deep in the dust the far shore fades out, or a hundred thousand
       overlapping motes burn the frame to white; the far sky is exempt */
    'float sky=step(400.0,length(aP));'+
    'float fade=mix(1.0-smoothstep(uFog*1.5,uFog*3.2,w),1.0,sky);'+
    /* and the dust itself thins as you come close — four hundred thousand
       rocks shoulder to shoulder read as a wall, not as worlds */
    'if(k>0.5&&k<1.5){'+
      'float dz=min(uFog/235.0,1.0);'+
      'float dens=max(0.01,dz*dz*dz);'+
      'float rk=fract(ph*997.13);'+
      'fade*=smoothstep(rk-0.06,rk+0.06,dens);'+
      'px=min(px,52.0);gl_PointSize=px;}'+
    'if(fade<0.004)gl_Position=vec4(2.0,2.0,2.0,1.0);'+
    'vC=vec4(aC.rgb,aC.a*tw*fade);vK=k;vPx=px;vSd=ph;vF=fade;}');
  /* far away every world is a mote of light; come close and the grey ones
     turn to cratered stone, the blue ones to oceans, the gold ones to fire */
  const fs=shader(gl.FRAGMENT_SHADER,
    'precision mediump float;'+
    'varying vec4 vC;varying float vK;varying float vPx;varying float vSd;varying float vF;'+
    'uniform highp float uT;'+ /* must match the vertex stage's precision */
    'float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}'+
    'float vn(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);'+
    'float a=h21(i);float b=h21(i+vec2(1.0,0.0));float c=h21(i+vec2(0.0,1.0));float d2=h21(i+vec2(1.0,1.0));'+
    'return mix(mix(a,b,f.x),mix(c,d2,f.x),f.y);}'+
    'void main(){'+
    'vec2 d=gl_PointCoord-vec2(0.5);'+
    'float r2=dot(d,d)*4.0;'+
    'float soft=1.0-clamp(r2,0.0,1.0);soft*=soft;'+
    'vec3 glow=vC.rgb*vC.a*soft;'+
    'if(vK<0.5||vPx<15.0){if(r2>1.0)discard;gl_FragColor=vec4(glow,1.0);return;}'+
    'float m=smoothstep(15.0,30.0,vPx);'+
    'vec2 sp=d+vec2(vSd*57.0,vSd*91.0);'+
    'if(vK>2.5){'+
      /* a burning sun: layered fire crawling over the surface, a corona of
         tongues; the chefs (kind 4) visibly spin even when the sky stands still */
      'if(r2>1.55)discard;'+
      'vec2 q=d;'+
      'if(vK>3.5){float an=uT*0.65;float ca=cos(an);float sa=sin(an);'+
        'q=vec2(ca*d.x-sa*d.y,sa*d.x+ca*d.y);}'+
      'vec2 sq=q+vec2(vSd*57.0,vSd*91.0);'+
      'float fl=vn(sq*6.0+vec2(0.0,-uT*0.30))'+
        '+0.55*vn(sq*12.0+vec2(uT*0.22,uT*0.4))'+
        '+0.3*vn(sq*22.0-vec2(uT*0.6,0.0));'+
      'fl*=0.54;'+
      'float heat=1.0-clamp(r2,0.0,1.0);'+
      'float e=heat*(0.5+0.85*fl);'+
      'vec3 col=vec3(0.55,0.07,0.02)*smoothstep(0.0,0.22,e)'+
        '+vec3(1.0,0.5,0.1)*smoothstep(0.16,0.55,e)'+
        '+vec3(1.0,0.93,0.62)*smoothstep(0.5,0.9,e);'+
      'float ang=atan(q.y,q.x);'+
      'float tongue=vn(vec2(ang*2.4+vSd*23.0,uT*0.45))*0.6'+
        '+vn(vec2(ang*4.8+vSd*57.0,-uT*0.7))*0.4;'+
      'float cor=smoothstep(1.55,0.78,r2)*(0.18+0.5*tongue*tongue);'+
      'float body=1.0-smoothstep(0.82,0.98,r2);'+
      'vec3 fin=col*body+vec3(1.0,0.45,0.08)*cor*(1.0-body);'+
      'gl_FragColor=vec4(mix(glow,fin*vF,m),1.0);return;}'+
    'if(r2>1.0)discard;'+
    'float edge=1.0-smoothstep(0.88,1.0,r2);'+
    'float nz=sqrt(max(0.0,1.0-r2));'+
    'vec3 n=normalize(vec3(d.x*2.0,-d.y*2.0,nz));'+
    'vec3 L=normalize(vec3(-0.55,0.5,0.72));'+
    'float diff=max(dot(n,L),0.0);'+
    'vec3 col;'+
    'if(vK>1.5){'+
      /* an ocean world: still continents, water that visibly flows, drifting
         cloud, a breath of atmosphere at the limb */
      'float cont=smoothstep(0.5,0.6,vn(sp*5.0));'+
      'float wa=vn(sp*11.0+vec2(uT*0.10,uT*0.045));'+
      'float wb=vn(sp*19.0-vec2(uT*0.16,0.0));'+
      'vec3 sea=mix(vec3(0.02,0.24,0.52),vec3(0.06,0.52,0.78),0.25+0.6*(wa*0.7+wb*0.3));'+
      'vec3 land=mix(vec3(0.10,0.46,0.28),vec3(0.34,0.52,0.24),vn(sp*9.0));'+
      'vec3 base=mix(sea,land,cont);'+
      'float cloud=smoothstep(0.6,0.8,vn(sp*8.0+vec2(uT*0.05,0.0)));'+
      'base=mix(base,vec3(0.92,0.95,0.97),cloud*0.55);'+
      'float spec=pow(max(dot(reflect(-L,n),vec3(0.0,0.0,1.0)),0.0),24.0)*(1.0-cont)*(0.35+0.45*wb);'+

function bindAttribs(){
  const aP=gl.getAttribLocation(prog,'aP'),aS=gl.getAttribLocation(prog,'aS'),

function upStatic(){
  const s=buildStatic();

}
function upDyn(time){
  const d=buildDyn(time);
  if(!dynBuf)dynBuf=gl.createBuffer();

/* ---- matrices, by hand ---- */
const FOV=55*Math.PI/180;
let MVP=new Float32Array(16);
function calcMVP(){
  const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);
  /* the camera orbits whatever it is looking at — the bowl, or one star */
  const cx=cam.tx,cyy=cam.ty,cz=cam.tz;
  const ex=cx+cam.dist*cp*sy, ey=cyy+cam.dist*sp, ez=cz+cam.dist*cp*cy;
  let zx=ex-cx,zy=ey-cyy,zz=ez-cz;
  const zl=Math.hypot(zx,zy,zz);zx/=zl;zy/=zl;zz/=zl;
  /* x = up cross z, with up=(0,1,0) */
  let xx=zz,xy=0,xz=-zx;
  const xl=Math.hypot(xx,xy,xz)||1;xx/=xl;xy/=xl;xz/=xl;
  const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  const f=1/Math.tan(FOV/2),asp=W/Math.max(1,H),near=2,far=6000;
  const a=f/asp,b=f,c=(far+near)/(near-far),d=(2*far*near)/(near-far);
  /* column major: proj * view */
  const tx=-(xx*ex+xy*ey+xz*ez),ty=-(yx*ex+yy*ey+yz*ez),tz=-(zx*ex+zy*ey+zz*ez);
  MVP[0]=a*xx; MVP[1]=b*yx; MVP[2]=c*zx;  MVP[3]=-zx;
  MVP[4]=a*xy; MVP[5]=b*yy; MVP[6]=c*zy;  MVP[7]=-zy;
  MVP[8]=a*xz; MVP[9]=b*yz; MVP[10]=c*zz; MVP[11]=-zz;
  MVP[12]=a*tx;MVP[13]=b*ty;MVP[14]=c*tz+d;MVP[15]=-tz;
  return {ex,ey,ez};
}
function project(p){
  /* same matrix on the CPU, for picking gold stars */
  const x=p[0],y=p[1],z=p[2];
  const cx=MVP[0]*x+MVP[4]*y+MVP[8]*z+MVP[12];
  const cyy=MVP[1]*x+MVP[5]*y+MVP[9]*z+MVP[13];
  const w=MVP[3]*x+MVP[7]*y+MVP[11]*z+MVP[15];
  if(w<=0.001)return null;
  return [(cx/w*0.5+0.5)*W/dpr,(0.5-cyy/w*0.5)*H/dpr,w];
}

/* ================= frame ================= */
let t0=performance.now(),raf=0,lastDyn=-1;
function frame(now){
  raf=requestAnimationFrame(frame);
  const t=(now-t0)/1000;
  if(cam.tw){
    const k=Math.min(1,(now-cam.tw.t0)/cam.tw.dur);
    const e2=1-Math.pow(1-k,3);
    cam.yaw=cam.tw.y0+(cam.tw.y1-cam.tw.y0)*e2;
    cam.dist=cam.tw.d0+(cam.tw.d1-cam.tw.d0)*e2;
    cam.tx=cam.tw.f0[0]+(cam.tw.f1[0]-cam.tw.f0[0])*e2;
    cam.ty=cam.tw.f0[1]+(cam.tw.f1[1]-cam.tw.f0[1])*e2;
    cam.tz=cam.tw.f0[2]+(cam.tw.f1[2]-cam.tw.f0[2])*e2;
    if(k>=1)cam.tw=null;
  }else if(cam.auto&&motionOK&&spinOn)cam.yaw+=SPIN;
  calcMVP();
  if(motionOK||lastDyn<0||dynDirty){upDyn(motionOK?t:0);lastDyn=t;dynDirty=false;}
  gl.viewport(0,0,W,H);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniformMatrix4fv(uM,false,MVP);
  gl.uniform1f(uT,motionOK?t:0);
  gl.uniform1f(uPx,(H*0.5)/Math.tan(FOV/2));
  gl.uniform1f(uFog,cam.dist);
  gl.bindBuffer(gl.ARRAY_BUFFER,statBuf);bindAttribs();
  gl.drawArrays(gl.POINTS,0,statN);
  gl.bindBuffer(gl.ARRAY_BUFFER,dynBuf);bindAttribs();
  gl.drawArrays(gl.POINTS,0,dynN);
  drawLines(t);
}

let drag=null,pinch0=0;
cv.addEventListener('pointerdown',e=>{
  if(!e.isPrimary)return; /* a second finger must never grab the camera */
  cv.setPointerCapture(e.pointerId);
  drag={x:e.clientX,y:e.clientY,moved:false};
  cam.auto=false;cam.tw=null;cv.classList.add('grabbing');
});
cv.addEventListener('pointermove',e=>{
  if(!e.isPrimary)return;
  if(drag&&(e.buttons&1||e.pointerType==='touch')){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
    cam.yaw+=dx*0.0052;
    cam.pitch=Math.min(1.38,Math.max(0.10,cam.pitch+dy*0.004));

  drag=null;
  clearTimeout(cam.idleT);cam.idleT=setTimeout(()=>{cam.auto=true;},4000);
  if(!wasTap)return;
  const xy=evXY(e);
  const hit=pickReg(xy[0],xy[1],18);
  if(hit){openPanel(hit.p);return;}
  if(nearVault(xy[0],xy[1])){uvsMsg('',ui().poolSoon,3600);return;}

  if(di>=0){openDust(di);return;}

  else toggleSpin();
});
/* the golden heart of the bowl is the NOODL staking vault */
function nearVault(px,py){
  const c=project([0,-4,0]);
  if(!c)return false;
  const rpx=Math.max(26,10.5*((H*0.5)/Math.tan(FOV/2))/dpr/c[2]);
  const dx=c[0]-px,dy=c[1]-py;
  return dx*dx+dy*dy<rpx*rpx;
}
/* any mote of dust answers to a page of the V1 register */
function pickDust(px,py,rad){
  if(!DUST.pos)return -1;
  let best=-1,bd=rad*rad;
  const P=DUST.pos;
  for(let i=0;i<P.length;i+=3){
    const x=P[i],y=P[i+1],z=P[i+2];
    const w=MVP[3]*x+MVP[7]*y+MVP[11]*z+MVP[15];
    if(w<=0.001)continue;
    const sx=((MVP[0]*x+MVP[4]*y+MVP[8]*z+MVP[12])/w*0.5+0.5)*W/dpr-px;
    const sy=((0.5-(MVP[1]*x+MVP[5]*y+MVP[9]*z+MVP[13])/w*0.5))*H/dpr-py;
    const dd=sx*sx+sy*sy;
    if(dd<bd){bd=dd;best=i/3;}
  }
  return best;
}
async function openDust(i){
  uvsMsg('',ui().dustFinding);
  const page=Math.floor(i/100)+1;
  let rows=DUST.cache.get(page);
  if(!rows){
    const j=await apiV1('/users?limit=100&page='+page+'&env=production');
    rows=(j&&j.data)||null;
    if(rows)DUST.cache.set(page,rows);
  }
  const row=rows&&rows[i%100];
  if(!row||!row.principal){uvsMsg('err',ui().dustNone,3000);return;}
  const p=row.principal;
  if(!REG.map.has(p)){
    /* pin the ghost on the very dot that was clicked */
    GHOSTS.push({p,pos:[DUST.pos[i*3],DUST.pos[i*3+1],DUST.pos[i*3+2]],name:row.username});
    regBuild();
  }
  const o=REG.map.get(p);
  if(o&&!o.name)o.name=row.username;
  uvsMsg('','');
  openPanel(p);
}

/* ---- meeting a star ---- */
const tip=$('#tip');
function fmtTok(v){
  const t=v/1e11;
  return t>=1e6?(t/1e6).toFixed(2)+'M':t>=1e3?(t/1e3).toFixed(1)+'K':t.toFixed(0);
}
function shortP(p){return p.slice(0,5)+'…'+p.slice(-3);}
function evXY(e){
  /* pointer coords arrive in viewport space; the sky is projected in canvas space */
  const r=cv.getBoundingClientRect();
  return [e.clientX-r.left,e.clientY-r.top];
}
function pickReg(px,py,rad){
  let best=null,bd=rad*rad;
  for(const o of REG.list){
    const s=project(o.pos);if(!s)continue;
    const dx=s[0]-px,dy=s[1]-py,d=dx*dx+dy*dy;
    if(d<bd){bd=d;best=o;}
  }
  return best;
}
function hoverAt(px,py){
  const o=pickReg(px,py,15);
  if(!o){
    if(nearVault(px,py)){
      cv.classList.add('aim');
      const u=ui();
      tip.querySelector('b').textContent=u.poolName;
      tip.querySelector('span').textContent=u.poolSoon;
      tip.style.display='block';
      tip.style.left=Math.min($('#stage').clientWidth-260,px+14)+'px';
      tip.style.top=Math.max(8,py-14)+'px';
      return;
    }
    tip.style.display='none';cv.classList.remove('aim');return;
  }
  cv.classList.add('aim');
  const u=ui();
  tip.querySelector('b').textContent=o.name||shortP(o.p);
  tip.querySelector('span').textContent=
    o.kind==='gold'?u.tipHeld.replace('{n}',fmtTok(o.bal)):
    o.kind==='ghost'?u.tipGhost:u.tipView;
  tip.style.display='block';
  const stw=$('#stage').clientWidth;
  tip.style.left=Math.min(stw-260,px+14)+'px';
  tip.style.top=Math.max(8,py-14)+'px';
}
function focusStar(pos){
  /* fly in until the star fills the stage; afterwards the whole universe
     keeps turning — around IT */
  let cur=cam.yaw%(Math.PI*2);if(cur<0)cur+=Math.PI*2;
  const ta=Math.atan2(pos[0],pos[2]);
  let d=ta-cur;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
  cam.yaw=cur;
  /* the view keeps its size — only the centre of the world changes */
  cam.tw={t0:performance.now(),dur:motionOK?950:1,
    y0:cur,y1:cur+d,
    d0:cam.dist,d1:cam.dist,
    f0:[cam.tx,cam.ty,cam.tz],f1:[pos[0],pos[1],pos[2]]};
  cam.auto=true;
}
function focusHome(){
  cam.tw={t0:performance.now(),dur:motionOK?950:1,
    y0:cam.yaw,y1:cam.yaw,
    d0:cam.dist,d1:cam.dist,
    f0:[cam.tx,cam.ty,cam.tz],f1:[0,-14,0]};
}

/* ================= the trails, inked over the sky ================= */
const lcv=$('#lines');
let lg=lcv.getContext('2d');
function drawLines(t){
  const w=lcv.width/dpr,h=lcv.height/dpr;
  lg.setTransform(dpr,0,0,dpr,0,0);
  lg.clearRect(0,0,w,h);
  /* chefs wear a dotted halo, like the pool ring they stir */
  lg.setLineDash([2.5,3.5]);
  for(const o of REG.list){
    if(!o.chef&&o.kind!=='chef')continue;
    const s=project(o.pos);if(!s)continue;
    const rr=9+1.6*Math.sin(t*2.6+o.hash*40);
    lg.strokeStyle='rgba(252,209,79,.55)';
    lg.lineWidth=1;
    lg.beginPath();lg.arc(s[0],s[1],rr,0,Math.PI*2);lg.stroke();
  }
  lg.setLineDash([]);
  /* money trails of the account under the glass */
  if(PANEL.cur&&REL.p===PANEL.cur&&REL.edges.length&&!$('#panel').hidden){
    const me=REG.map.get(REL.p);
    if(me){
      const a=project(me.pos);
      if(a){
        for(const e of REL.edges){
          const o=REG.map.get(e.p);if(!o)continue;
          const b=project(o.pos);if(!b)continue;
          const pulse=motionOK?0.55+0.25*Math.sin(t*2+((e.p.charCodeAt(0)||0)%7)):0.7;
          if(e.dir==='ref'){lg.setLineDash([4,5]);lg.strokeStyle='rgba(168,170,184,'+(pulse*0.8)+')';}
          else if(e.dir==='in'){lg.setLineDash([]);lg.strokeStyle='rgba(61,220,132,'+pulse+')';}
          else{lg.setLineDash([]);lg.strokeStyle='rgba(239,149,48,'+pulse+')';}
          lg.lineWidth=e.dir==='ref'?1:1.4;
          lg.beginPath();lg.moveTo(a[0],a[1]);lg.lineTo(b[0],b[1]);lg.stroke();
          lg.setLineDash([]);
          lg.fillStyle=e.dir==='in'?'rgba(61,220,132,.9)':e.dir==='ref'?'rgba(168,170,184,.9)':'rgba(239,149,48,.9)';
          lg.beginPath();lg.arc(b[0],b[1],2.2,0,Math.PI*2);lg.fill();
        }
        lg.strokeStyle='rgba(250,250,250,.85)';
        lg.lineWidth=1.2;
        lg.beginPath();lg.arc(a[0],a[1],10+(motionOK?1.8*Math.sin(t*3):0),0,Math.PI*2);lg.stroke();
      }
    }
  }
}

/* ================= the chopsticks in the corner ================= */
function drawSticks(){
  const c=$('#sticks'),g=c.getContext('2d');
  g.clearRect(0,0,300,300);
  g.lineCap='round';
  for(const [x0,y0,x1,y1,w] of [[298,-8,150,208,11],[302,34,186,232,11]]){
    g.strokeStyle='#8a5a34';g.lineWidth=w;
    g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
    g.strokeStyle='#b8804e';g.lineWidth=w*0.45;
    g.beginPath();g.moveTo(x0-2,y0);g.lineTo(x1-2,y1);g.stroke();
  }
  /* one noodle strand, caught mid-lift */
  g.strokeStyle='#fcd14f';g.lineWidth=4.5;
  g.beginPath();g.moveTo(158,214);
  g.bezierCurveTo(120,258,178,278,142,300);
  g.stroke();
  g.strokeStyle='rgba(255,236,170,.75)';g.lineWidth=1.8;
  g.beginPath();g.moveTo(157,216);
  g.bezierCurveTo(121,257,177,276,143,298);
  g.stroke();
}

function fit(){
  const st=$('#stage');
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,Math.round(st.clientWidth*dpr));
  H=Math.max(1,Math.round(st.clientHeight*dpr));
  cv.width=W;cv.height=H;
  lcv.width=W;lcv.height=H;
}
window.addEventListener('resize',fit);

  $('#nLegacy').textContent=fmtN(UD.v1);
  $('#nTotal').textContent=fmtN(UD.v2);
  $('#nActive').textContent=UD.active?fmtN(UD.active):'—';
  $('#nNoodl').textContent=gold.list.length?fmtN(gold.list.length):'—';

/* gold stars live from the well; baked list as the fallback */
async function api(path){
  try{
    const r=await fetch('https://api.odin.fun/v2'+path,{cache:'no-store'});
    if(r.ok)return await r.json();
  }catch(e){}
  try{
    const r=await fetch('/api/odin'+path,{cache:'no-store'});
    if(r.ok)return await r.json();
  }catch(e){}
  return null;
}
async function pullGold(){
  const rows=[];
  let want=Infinity;
  for(let p=1;rows.length<want&&p<9;p++){
    const j=await api('/token/hjrg/owners?limit=500&page='+p);
    if(!j||!j.data)break;
    want=j.count;
    for(const r of j.data)if(r.balance>0)rows.push([r.user,r.user_username||'',r.balance]);
    if(!j.data.length)break;
  }
  if(rows.length>50){
    rows.sort((a,b)=>b[2]-a[2]);
    gold.list=rows;
    goldPrep();
    $('#livTag').hidden=false;
  }
  paintStats();
}

async function pullChefs(){
  const j=await api('/token/hjrg/liquidity?limit=1000');
  const rows=[];
  for(const r of (j&&j.data)||[])if(r.balance>0)rows.push([r.user,r.user_username||'',r.balance]);
  if(rows.length){
    rows.sort((a,b)=>b[2]-a[2]);
    CHEF.list=rows;
    CHEF.set=new Set(rows.map(c=>c[0]));
    regBuild();
  }
}

/* ================= the dossier =================
   Click a star — any star with a name — and the universe pulls its file:
   who they are, what they hold, what they already sold, what is left on
   legacy, and whose money has touched theirs. */
const MS=1e11;
const PANEL={cur:null,cache:new Map()};
const REL={p:null,edges:[]};
let BTCUSD=0;
let ADDR=null;   /* the panel can also hold a bare bitcoin address */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fUsd(v){
  const s=v<0?'−':'';v=Math.abs(Number(v)||0);
  return s+'$'+(v>=1e6?(v/1e6).toFixed(2)+'M':v>=1e4?(v/1e3).toFixed(1)+'K':v>=100?v.toFixed(0):v.toFixed(2));
}
function fSign(v){return (v>0?'+':'')+fUsd(v);}
function fUsdP(v){
  /* per-token prices live far below a cent; keep their first real digits */
  v=Number(v)||0;
  if(v===0)return '$0';
  if(v>=0.01)return fUsd(v);
  return '$'+(v<1e-7?v.toExponential(1):v.toPrecision(2));
}
function cls(v){return v>0?'up':v<0?'dn':'fl';}
function shortAddr(a){return a?a.slice(0,10)+'…'+a.slice(-6):'—';}
function uvsMsg(kind,txt,ttl){
  const m=$('#uMsg');
  m.hidden=!txt;
  m.className='uvs-msg'+(kind?' '+kind:'');
  m.textContent=txt||'';
  clearTimeout(uvsMsg.t);
  if(txt&&ttl)uvsMsg.t=setTimeout(()=>{m.hidden=true;},ttl);
}
async function getBtcUsd(){
  if(BTCUSD)return BTCUSD;
  const c=await api('/currency/btc');
  BTCUSD=Number(c&&c.amount)||0;
  return BTCUSD;
}
async function apiV1(path){
  try{
    const r=await fetch('https://api.odin.fun/v1'+path,{cache:'no-store'});
    if(r.ok)return await r.json();
  }catch(e){}
  return null;
}
function mapTok(btcUsd){
  return r=>{
    const tk=r.token||{};
    return {
      id:tk.id,ticker:tk.ticker||tk.name||String(tk.id||''),
      amt:Number(r.balance)/MS,
      costUsd:Number(r.price||0)/MS*btcUsd,
      curUsd:Number(tk.price||0)/MS*btcUsd,
      usd:Number(r.balance)*Number(tk.price||0)/1e22*btcUsd,
      pnl:Number(r.unrealized_pnl)||0,
      pct:r.unrealized_pnl_percent==null?null:Number(r.unrealized_pnl_percent)
    };
  };
}
async function loadCore(st){
  const btcUsd=await getBtcUsd();
  const [u,sr,bal]=await Promise.all([
    api('/user/'+st.p),
    api('/user/'+st.p+'/stats'),
    api('/user/'+st.p+'/balances?limit=100')
  ]);
  st.user=u||{};
  st.stats=(sr&&sr.data)||{};
  if(!u&&!sr&&!bal)st.coreErr=true; /* the well is dry, not the account */
  const wal=((bal&&bal.data)||[]).find(t=>t.id==='btc');
  st.walletBtc=bal?(wal?Number(wal.balance)/MS:0):null; /* no answer ≠ zero */
  let rows=[],page=1,count=Infinity;
  while(rows.length<count&&page<=5){
    const r=await api('/user/'+st.p+'/tokens?sort=holding_value%3Adesc&limit=30&page='+page);
    if(!r)break;
    count=r.count||0;
    if(!(r.data||[]).length)break;
    rows=rows.concat(r.data);page++;
  }
  st.toks=rows.map(mapTok(btcUsd)).filter(t=>t.amt>0);
  st.holdUsd=st.toks.reduce((q,t)=>q+t.usd,0);
  st.pnlUsd=st.toks.reduce((q,t)=>q+t.pnl,0);
  st.coreDone=true;
}
async function loadDays(st){
  let rows=[],page=1,count=Infinity;
  while(rows.length<count&&page<=3){
    const r=await api('/user/'+st.p+'/activity?token=hjrg&limit=100&page='+page);
    if(!r)break;
    count=r.count||0;
    if(!(r.data||[]).length)break;
    rows=rows.concat(r.data);page++;
  }
  /* oldest first: BUY or RECEIVE starts the clock, SELL resets it, SEND does not */
  let clock=0;
  for(let i=rows.length-1;i>=0;i--){
    const a=rows[i].action;
    if((a==='BUY'||a==='RECEIVE')&&!clock)clock=Date.parse(rows[i].time)||0;
    else if(a==='SELL')clock=0;
  }
  st.days=clock?Math.floor((Date.now()-clock)/864e5):0;
  st.daysDone=true;
}
async function loadActivity(st){
  const btcUsd=await getBtcUsd();
  let rows=[],page=1,count=Infinity;
  while(rows.length<count&&page<=15){
    const r=await api('/user/'+st.p+'/activity?limit=100&page='+page);
    if(!r)break;
    count=r.count||0;
    if(!(r.data||[]).length)break;
    rows=rows.concat(r.data);page++;
  }
  st.actScanned=rows.length;
  st.actCapped=count>rows.length;
  const agg={},rel={};
  for(const r of rows){
    const tid=(r.token&&r.token.id)||'';
    if(r.action==='BUY'||r.action==='SELL'){
      const a=agg[tid]||(agg[tid]={tk:(r.token&&(r.token.ticker||r.token.name))||tid,bA:0,bB:0,sA:0,sB:0});
      if(r.action==='BUY'){a.bA+=Number(r.amount_token)||0;a.bB+=Number(r.amount_btc)||0;}
      else{a.sA+=Number(r.amount_token)||0;a.sB+=Number(r.amount_btc)||0;}
    }else if(r.action==='SEND'||r.action==='RECEIVE'){
      const m=String(r.data||'').match(/(To|From):\s*([a-z0-9-]{10,})/i);
      if(m){
        const dir=r.action==='SEND'?'out':'in';
        const e=rel[dir+m[2]]||(rel[dir+m[2]]={p:m[2].toLowerCase(),dir,n:0});
        e.n++;
      }
    }
  }
  const sold=[];let tot=0;
  for(const k in agg){
    const a=agg[k];
    if(a.sA<=0)continue;
    /* cost only what the record can vouch for: tokens sold beyond the
       recorded buys (received, or bought before the window) carry no
       cost — pricing them at the buy average flips profits into losses */
    const avg=a.bA>0?a.bB/a.bA:null;
    const covered=avg==null?0:Math.min(a.sA,a.bA);
    const rz=(a.sB-(avg==null?0:covered*avg))/MS*btcUsd;
    sold.push({tk:a.tk,id:k,rz,noCost:avg==null||a.sA>a.bA*1.001});
    tot+=rz;
  }
  sold.sort((x,y)=>Math.abs(y.rz)-Math.abs(x.rz));
  st.sold=sold;st.soldTot=tot;st.soldDone=true;
  const edges=Object.values(rel).sort((a,b)=>b.n-a.n).slice(0,12);
  for(const e of edges)ensureStar(e.p);
  st.edges=edges;
  /* names for the closest few trails */
  for(const e of edges.slice(0,6)){
    if(PANEL.cur!==st.p)break;
    const o=REG.map.get(e.p);
    if(o&&o.name){e.name=o.name;continue;}
    const u=await api('/user/'+e.p);
    if(u&&u.username){e.name=u.username;if(o)o.name=u.username;}
  }
}
function refEdges(st){
  const out=(st.edges||[]).slice();
  const ref=st.user&&st.user.referrer;
  if(ref&&!out.some(e=>e.p===ref)){ensureStar(ref);out.push({p:ref,dir:'ref',n:0});}
  return out;
}
async function loadLegacy(st){
  const btcUsd=await getBtcUsd();
  let raw=[],page=1,count=Infinity;
  while(raw.length<count&&page<=3){
    const r=await apiV1('/user/'+st.p+'/tokens?sort=holding_value%3Adesc&limit=30&page='+page+'&env=production');
    if(!r){if(page===1)st.legacyErr=true;break;}
    count=r.count||0;
    if(!(r.data||[]).length)break;
    raw=raw.concat(r.data);page++;
  }
  const rows=raw.map(mapTok(btcUsd)).filter(t=>t.amt>0);
  rows.forEach(x=>{x.v1=true;});
  st.legacy=rows;
  st.legacyCount=rows.length;
  st.legacyPart=raw.length<count; /* the Σ only covers what was fetched */
  st.legacyPnl=rows.reduce((q,t)=>q+t.pnl,0);
  st.legacyDone=true;
}
function openPanel(p){
  ADDR=null;
  PANEL.cur=p;
  REL.p=p;REL.edges=[];
  let st=PANEL.cache.get(p);
  if(st&&(st.coreErr||st.legacyErr)){PANEL.cache.delete(p);st=null;} /* a failed file deserves a retry */
  const fresh=!st;
  if(fresh){st={p};PANEL.cache.set(p,st);}
  $('#panel').hidden=false;
  const o=ensureStar(p);
  focusStar(o.pos);
  renderPanel();
  if(st.edges)REL.edges=refEdges(st);
  if(!fresh){ /* the dossier keeps, but money in flight does not */
    loadFlight(st).then(()=>{if(PANEL.cur===st.p)renderPanel();}).catch(()=>{});
    flightTick();return;}
  /* every load reports to one desk, and the desk only serves whoever is
     under the glass RIGHT NOW — late arrivals for other stars are ignored */
  const done=()=>{
    if(PANEL.cur!==st.p)return;
    renderPanel();
    if(st.edges){REL.p=st.p;REL.edges=refEdges(st);}
  };
  loadCore(st).then(done).catch(()=>{st.coreDone=true;st.coreErr=true;done();});
  loadDays(st).then(done).catch(()=>{st.daysDone=true;done();});
  loadActivity(st).then(done).catch(()=>{st.soldDone=true;done();});
  loadLegacy(st).then(done).catch(()=>{st.legacyDone=true;st.legacyErr=true;done();});
  loadFlight(st).then(()=>{done();flightTick();}).catch(()=>{st.flight={done:true,dep:[],wit:[]};done();});
}
function closePanel(){
  $('#panel').hidden=true;
  ADDR=null;flightStop();
  PANEL.cur=null;
  REL.p=null;REL.edges=[];
  focusHome();
}
$('#pnX').addEventListener('click',closePanel);
function copyText(t,el){
  try{navigator.clipboard.writeText(t);}catch(e){}
  if(el){const old=el.textContent;el.textContent=ui().copied;setTimeout(()=>{el.textContent=old;},900);}
}
function tlogo(id,v1){
  /* the coin's own face: v2 through the api, v1 straight off the image host */
  if(!id)return '';
  const src=v1?'https://images.odin.fun/token/'+encodeURIComponent(id)
             :'https://api.odin.fun/v2/token/'+encodeURIComponent(id)+'/image';
  return '<img class="tlogo" src="'+src+'" alt="" onerror="this.style.visibility=\'hidden\'">';
}
function trowHtml(t){
  return '<div class="trow">'+tlogo(t.id,t.v1)+'<b>'+esc(t.ticker)+'</b>'
    +'<i>'+esc(fmtTok(t.amt*MS))+' · '+fUsdP(t.costUsd)+' → '+fUsdP(t.curUsd)+'</i>'
    +'<em class="'+cls(t.pnl)+'">'+fSign(t.pnl)+(t.pct==null?'':' · '+(t.pct>0?'+':'')+t.pct.toFixed(0)+'%')+'</em></div>';
}
function renderPanel(){
  const p=PANEL.cur;if(!p)return;
  const st=PANEL.cache.get(p)||{};
  const u=ui();
  const o=REG.map.get(p)||{};
  const name=(st.user&&st.user.username)||o.name||shortP(p);
  $('#pnName').textContent=name;
  $('#pnId').textContent=p;
  const av=$('#pnAv');
  av.textContent=(name||'?').slice(0,1).toUpperCase();
  av.className='pn-av'+(o.kind==='gold'||o.kind==='chef'?'':o.kind==='ghost'?' gh':' cy');
  /* chips: the callsigns this address has earned */
  const chips=[];
  const holdsNoodl=o.kind==='gold'||(st.toks||[]).some(t=>t.id==='hjrg');
  if(holdsNoodl)chips.push(['gold',u.chipHolder]);
  if(CHEF.set.has(p))chips.push(['cyan',u.chipChef]);
  if(st.days>=30)chips.push(['grn',u.chipNoodler]);
  chips.push(['dim',u.rank]);
  $('#pnChips').innerHTML=chips.map(c=>'<span class="chip '+c[0]+'">'+esc(c[1])+'</span>').join('');
  /* body */
  let h='';
  h+=flightHtml(st);
  h+='<div class="pn-sec"><h3>'+esc(u.secId)+'</h3><div class="kv">';
  h+='<span>'+esc(u.kJoined)+'</span><b>'+(st.user&&st.user.created_at?esc(String(st.user.created_at).slice(0,10)):'…')+'</b>';
  h+='<span>'+esc(u.kWallet)+'</span><b class="addr" data-copy="'+esc((st.user&&st.user.btc_wallet_address)||'')+'">'+esc(shortAddr(st.user&&st.user.btc_wallet_address))+'</b>';
  h+='<span>'+esc(u.kDeposit)+'</span><b class="addr" data-copy="'+esc((st.user&&st.user.btc_deposit_address)||'')+'">'+esc(shortAddr(st.user&&st.user.btc_deposit_address))+'</b>';
  const tavB=st.stats&&st.stats.total_asset_value!=null?Number(st.stats.total_asset_value)/MS:null;
  h+='<span>'+esc(u.kAssets)+'</span><b>'+(tavB==null?'…':fUsd(tavB*BTCUSD)+' · '+tavB.toFixed(4)+' BTC')+'</b>';
  h+='<span>'+esc(u.kWalletBtc)+'</span><b>'+(st.walletBtc==null?'…':st.walletBtc.toFixed(5)+' BTC')+'</b>';
  h+='</div></div>';
  /* holding now */
  h+='<div class="pn-sec"><h3>'+esc(u.secHold)+'</h3>';

/* ================= money in flight =================
   Odin only writes a deposit down once it has been mined, so the window a
   worried depositor cares about — broadcast, mempool, first confirmation,
   odin's indexer catching up — is invisible from the account alone. It is
   perfectly visible from the deposit ADDRESS, and odin's own /utxo endpoint
   reports zero-confirmation outputs, so one call answers the question. */
function fSats(v){
  const b=(Number(v)||0)/1e8;
  const t=b.toFixed(8).replace(/0+$/,'').replace(/\.$/,'');
  return (t||'0')+' BTC';
}
function fAgo(ms){
  const m=Math.max(0,Math.round(ms/60000));
  if(m<60)return lang==='zh'?m+' 分钟':m+' min';
  const h=Math.floor(m/60);
  if(h<24)return lang==='zh'?h+' 小时':h+' h';
  return lang==='zh'?Math.floor(h/24)+' 天':Math.floor(h/24)+' d';
}
const DEP_FEE=2010;   /* sats; flat across all 60 of the most recent deposits */
const FLIGHT_DAYS=7;  /* how far back a payment can be and still count as "in
   flight". The v2 ledger starts at the V2 launch (~2026-06), so a deposit
   address that has been alive since V1 carries payments v2 has never heard of;
   reading its whole history accuses odin of eating money it credited a year
   ago. Anything older than this window is history, not money in the air. */
const BTC_RE=/^(bc1[ac-hj-np-z02-9]{11,84}|[13][1-9A-HJ-NP-Za-km-z]{25,34})$/;
function parseAddr(v){
  v=(v||'').trim().replace(/\s+/g,'').replace(/^bitcoin:/i,'').split('?')[0];
  if(/^BC1[AC-HJ-NP-Z02-9]+$/.test(v))v=v.toLowerCase();   /* bech32 may be shouted */
  return BTC_RE.test(v)?v:null;
}
const EXPL=['https://mempool.space/api','https://blockstream.info/api'];
async function mpApi(path){
  /* the explorers are a courtesy source and must never be the reason a panel
     breaks. Blockstream serves the same Esplora API byte for byte, so it is a
     free failover. Keep every call a SIMPLE request — one custom header and
     the preflight 404s. */
  for(const base of EXPL){
    try{
      const r=await fetch(base+path,{cache:'no-store'});
      if(!r.ok)continue;
      return await r.json();
    }catch(e){}
  }
  return null;
}
async function utxoOf(addr){
  /* odin answers this for ANY bitcoin address, mempool outputs included — and
     for an address with a long history it answers with megabytes. The search
     box takes anything a visitor pastes, so the call gets a time limit and the
     answer gets a ceiling. */
  const path='/user/'+encodeURIComponent(addr)+'/utxo';
  for(const base of ['https://api.odin.fun/v2','/api/odin']){
    let t=0;
    try{
      const c=new AbortController();
      t=setTimeout(()=>c.abort(),9000);
      const r=await fetch(base+path,{cache:'no-store',signal:c.signal});
      if(!r.ok){clearTimeout(t);continue;}
      const j=await r.json();
      clearTimeout(t);
      if(Array.isArray(j))return j.length>400?j.slice(0,400):j;
    }catch(e){clearTimeout(t);}
  }
  return null;                          /* a bad address is a 500, not an empty list */
}
let TIP={odin:0,btc:0,at:0};
async function chainTip(){
  if(TIP.at&&Date.now()-TIP.at<60000)return TIP;
  const [st,h]=await Promise.all([api('/settings'),mpApi('/blocks/tip/height')]);
  TIP={odin:Number(st&&st.last_indexed_block)||0,btc:Number(h)||0,at:Date.now()};
  return TIP;
}
async function loadFlight(st){
  const f={dep:[],wit:[],lastWit:null,tip:null,done:false};
  if(!st.flight)st.flight=f;   /* first time only: a refresh keeps the old
                                  numbers on screen until the new ones land */
  const who=(st.user&&st.user.btc_deposit_address)?st.user:await api('/user/'+st.p);
  f.addr=(who&&who.btc_deposit_address)||'';
  const [utxo,chain,acts,txr,pd,pw,tip]=await Promise.all([
    f.addr?utxoOf(f.addr):Promise.resolve(null),
    f.addr?mpApi('/address/'+encodeURIComponent(f.addr)+'/txs'):Promise.resolve(null),
    api('/user/'+st.p+'/activity?action_in=deposit,withdraw&limit=100'),
    api('/user/'+st.p+'/transactions?limit=100&sort=created_time%3Adesc'),
    api('/user/'+st.p+'/pending/deposit'),
    api('/user/'+st.p+'/pending/withdraw'),
    chainTip()
  ]);
  f.tip=tip;
  /* what odin has actually paid out: the activity feed carries txid:vout */
  const credited=new Set(),wits=[];
  let oldest=0;
  for(const r of ((acts&&acts.data)||[])){
    if(r.action==='DEPOSIT'&&r.data){
      credited.add(String(r.data));
      const ms=Date.parse(r.time)||0;
      if(ms&&(!oldest||ms<oldest))oldest=ms;
    }else if(r.action==='WITHDRAW')wits.push({t:Date.parse(r.time)||0,sats:Math.round((Number(r.amount_btc)||0)/1000)});
  }
  const whole=!!acts&&(!acts.count||acts.count<=((acts.data||[]).length));
  /* a ledger row appears at the first confirmation, about a minute before the
     balance moves — "odin has seen it" and "odin has paid it" are different news */
  const seen=new Set();
  for(const r of ((txr&&txr.data)||[]))if(r&&r.transaction&&r.transaction.id)seen.add(String(r.transaction.id));
  const unspent=new Set();
  for(const x of (utxo||[]))unspent.add(x.txid+':'+x.vout);
  /* EVERY payment into the deposit address, spent or not. A deposit odin has
     already swept into its own custody but never credited leaves no utxo
     behind — and that is precisely the case worth shouting about. Reading only
     the utxo set makes exactly that person's money invisible. */
  const rows=[];
  if(Array.isArray(chain)){
    for(const c of chain){
      const on=!!(c.status&&c.status.confirmed);
      const h=on?Number(c.status.block_height)||0:0;
      const conf=on?Math.max(1,(tip.btc||h)-h+1):0;
      (c.vout||[]).forEach((o,i)=>{
        if(o.scriptpubkey_address!==f.addr)return;
        rows.push({txid:c.txid,vout:i,sats:Number(o.value)||0,conf,h,
          ts:on?(Number(c.status.block_time)||0)*1000:0});
      });
    }
  }else for(const x of (utxo||[]))   /* no explorer: the unspent ones still show */
    rows.push({txid:x.txid,vout:x.vout,sats:Number(x.value)||0,conf:Number(x.confirmations)||0,h:0,ts:0});
  /* without the activity feed we cannot tell paid from unpaid, and a false
     "your money is stuck" is worse than saying nothing at all */
  if(acts)for(const d of rows){
    const key=d.txid+':'+d.vout;
    if(credited.has(key))continue;
    if(d.sats<=DEP_FEE)continue;                   /* 546-sat dust never credits */
    if(d.ts&&Date.now()-d.ts>FLIGHT_DAYS*864e5)continue;  /* history, not flight */
    if(!whole&&oldest&&d.ts&&d.ts<oldest)continue; /* older than the window we can vouch for */
    d.seen=seen.has(key);
    d.swept=!!utxo&&d.conf>0&&!unspent.has(key);
    f.dep.push(d);
  }
  for(const x of ((pd&&pd.data)||[])){             /* odin's own list, if it ever speaks */
    const id=String(x.txid||'');
    if(!id||f.dep.some(d=>d.txid===id))continue;
    f.dep.push({txid:id,vout:0,sats:Math.round((Number(x.amount)||0)/1000),conf:0,h:0,ts:0});
  }
  f.dep.sort((a,b)=>depSev(b)-depSev(a)||b.sats-a.sats);
  f.depMore=Math.max(0,f.dep.length-6);
  f.dep=f.dep.slice(0,6);
  for(const x of ((pw&&pw.data)||[])){
    const v=typeof x==='string'?x:((x&&(x.txid||x.id))||'');
    if(v)f.wit.push({txid:/^[0-9a-f]{64}$/i.test(v)?v:'',sats:Number(x&&x.amount)?Math.round(Number(x.amount)/1000):0});
  }
  wits.sort((a,b)=>b.t-a.t);
  f.lastWit=wits[0]||null;
  f.done=true;
  st.flight=f;
}
/* loudest first: money odin took and never paid out beats money still in the air */
function depSev(d){
  if(d.swept)return 3;
  if(d.conf>=3&&!d.seen)return 2;
  if(d.conf>=1)return 1;
  return 0;
}
function depLine(d,f){
  const u=ui(),n=fmtN(d.conf);
  if(d.swept)return {t:u.flSwept.replace('{n}',n),warn:true};
  /* odin writes a ledger row the moment it sees the transaction, mempool
     included — knowing it has been noticed is the whole point of the panel */
  if(d.seen)return {t:d.conf===0?u.flSeenMem:u.flSeen.replace('{n}',n),warn:false};
  if(d.conf===0)return {t:u.flMem,warn:false};
  const odin=f.tip&&f.tip.odin;
  if(odin&&d.h&&odin<d.h)
    return {t:u.flWait.replace('{n}',n)+u.flBehind.replace('{a}',fmtN(odin)).replace('{b}',fmtN(d.h)),warn:false};
  if(d.conf<=2)return {t:u.flWait.replace('{n}',n),warn:false};
  return {t:u.flWait.replace('{n}',n)+u.flPast.replace('{b}',fmtN(d.h)),warn:true};
}

      +'</div>';
  }
  for(const w of f.wit){
    h+='<div class="fl-row"><div class="fl-top"><span class="fl-tag out">'+esc(u.flWit)+'</span>'

      +'<div class="fl-st">'+esc(u.flWitNote.replace(/\*\*/g,''))+'</div></div>';
  }
  if(f.depMore)h+='<div class="fl-foot">'+esc(u.aMore.replace('{n}',fmtN(f.depMore)))+'</div>';

/* ---- a bare bitcoin address gets its own, simpler dossier ---- */
async function loadAddr(a){
  /* one small call first: it carries the balance AND tells us how busy this
     address is, which decides whether enumerating its outputs is sane */
  const stats=await mpApi('/address/'+encodeURIComponent(a.a));
  const busy=stats&&stats.chain_stats?Number(stats.chain_stats.tx_count)||0:null;
  const [utxo,mem,tip,who]=await Promise.all([
    (busy===null||busy<400)?utxoOf(a.a):Promise.resolve(null),
    mpApi('/address/'+encodeURIComponent(a.a)+'/txs/mempool'),
    chainTip(),
    api('/users?search='+encodeURIComponent(a.a)+'&limit=1')
  ]);
  const rows=[];
  if(Array.isArray(mem)){
    /* the fullest picture: money arriving AND money leaving, still unconfirmed */
    for(const t of mem){
      let inn=0,out=0;
      for(const o of (t.vout||[]))if(o.scriptpubkey_address===a.a)inn+=Number(o.value)||0;
      for(const i of (t.vin||[]))if(i.prevout&&i.prevout.scriptpubkey_address===a.a)out+=Number(i.prevout.value)||0;
      if(inn||out)rows.push({txid:t.txid,net:inn-out});
    }
  }else if(Array.isArray(utxo)){
    for(const x of utxo)if((Number(x.confirmations)||0)===0)rows.push({txid:x.txid,net:Number(x.value)||0});
  }
  /* biggest money first, arriving before leaving — that is the order a
     worried depositor reads in */
  rows.sort((x,y)=>(y.net>0?1:0)-(x.net>0?1:0)||Math.abs(y.net)-Math.abs(x.net));
  a.more=Math.max(0,rows.length-8);
  a.flight=rows.slice(0,8);
  const cs=stats&&stats.chain_stats,ms=stats&&stats.mempool_stats;
  a.bal=cs?(Number(cs.funded_txo_sum)||0)-(Number(cs.spent_txo_sum)||0)
          +(ms?(Number(ms.funded_txo_sum)||0)-(Number(ms.spent_txo_sum)||0):0)
        :(Array.isArray(utxo)?utxo.reduce((q,x)=>q+(Number(x.value)||0),0):null);
  a.tip=tip;
  a.user=(who&&who.data&&who.data[0])||null;
  a.err=(!stats&&utxo===null&&!Array.isArray(mem));
  a.done=true;
}

/* ---- money in flight is the one thing worth re-asking about ---- */
let FLT=0,fltN=0;
function flightStop(){clearTimeout(FLT);FLT=0;fltN=0;}
function flightTick(){
  clearTimeout(FLT);
  if(fltN>25)return;                            /* an open tab is not a licence to poll forever */
  FLT=setTimeout(async ()=>{
    if($('#panel').hidden)return flightStop();
    fltN++;
    try{
      if(ADDR){const m=ADDR;await loadAddr(m);if(ADDR===m)renderAddr();}
      else if(PANEL.cur){
        const st=PANEL.cache.get(PANEL.cur);
        if(st){await loadFlight(st);if(PANEL.cur===st.p)renderPanel();}
      }
    }catch(e){}
    flightTick();
  },60000);
}

/* ================= the eye of the universe ================= */
function parseId(v){
  v=(v||'').trim();
  const m=v.match(/odin\.fun\/user\/([a-z0-9-]+)/i);
  if(m)v=m[1];
  v=v.toLowerCase().replace(/\s+/g,'');
  return /^[a-z0-9]{2,7}(-[a-z0-9]{2,7}){4,14}$/.test(v)?v:null;
}
let searchBusy=false;
function foundStar(p){
  ensureStar(p);
  openPanel(p);
}
async function searchGo(){
  if(searchBusy)return;
  const u=ui(),q=($('#uq').value||'').trim();
  if(!q)return;
  const pick2=$('#upick');pick2.hidden=true;pick2.innerHTML='';
  searchBusy=true;$('#uqGo').disabled=true;
  try{
    const id=parseId(q);
    const ad=id?null:parseAddr(q);
    if(id){uvsMsg('','');foundStar(id);}
    else if(ad){uvsMsg('',u.sAddr);await openAddrPanel(ad);uvsMsg('','');}
    else{
      uvsMsg('',u.sFinding);
      const r=await api('/users?search='+encodeURIComponent(q)+'&limit=8');
      const hits=(r&&r.data)||[];
      if(!hits.length)uvsMsg('err',u.sNone);
      else if(hits.length===1){uvsMsg('','');foundStar(hits[0].principal);}
      else{
        uvsMsg('','');
        pick2.hidden=false;
        pick2.innerHTML=hits.map(h2=>'<button type="button" data-id="'+esc(h2.principal)+'">'
          +esc(h2.username||String(h2.principal).slice(0,12))
          +'<span>'+esc(String(h2.principal).slice(0,10))+'…</span></button>').join('');
      }
    }
  }catch(e){uvsMsg('err',u.sFail);}
  searchBusy=false;$('#uqGo').disabled=false;
}
$('#uqGo').addEventListener('click',searchGo);
$('#uq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchGo();}});
$('#upick').addEventListener('click',e=>{
  const b=e.target.closest?e.target.closest('button[data-id]'):null;
  if(b){$('#upick').hidden=true;foundStar(b.dataset.id);}
});

/* ================= 2d still, when webgl is missing ================= */
function flatStill(){
  $('#uv').hidden=true;
  const c=$('#flat');c.hidden=false;
  const st=$('#stage');
  c.width=st.clientWidth;c.height=st.clientHeight;
  const g=c.getContext('2d');
  g.fillStyle='#06070c';g.fillRect(0,0,c.width,c.height);
  const rnd=mulberry32(7),cx=c.width/2,cyy=c.height/2,S=Math.min(c.width,c.height)/240;
  function dot(x,z,col,r){
    g.fillStyle=col;
    g.beginPath();g.arc(cx+x*S,cyy+z*S*0.62,r,0,Math.PI*2);g.fill();
  }
  g.strokeStyle='rgba(240,226,203,.5)';g.lineWidth=2;
  g.beginPath();g.ellipse(cx,cyy,R*S,R*S*0.62,0,0,Math.PI*2);g.stroke();
  for(let i=0;i<9000;i++){const p=armPoint(rnd,Math.pow(rnd(),0.74));dot(p[0],p[2],'rgba(86,90,104,.5)',0.8);}
  for(let i=0;i<1400;i++){const p=armPoint(rnd,Math.pow(rnd(),0.74));dot(p[0],p[2],'rgba(0,229,229,.8)',1.1);}
  for(let i=0;i<gold.list.length;i++){const p=gold.pos[i];dot(p[0],p[2],'#fcd14f',2.2);}
  $('#nogl').style.display='block';
}

(function(){
  const m=location.search.match(/[?&]scan=([^&]+)/);
