/* ================= the tape ================= */
async function api(path){
  let last;
  for(const base of ODIN){
    try{
      const r=await fetch(base+path,{headers:{accept:'application/json'},cache:'no-store'});
      if(!r.ok){last=new Error(path+' HTTP '+r.status);continue;}
      return await r.json();
    }catch(e){last=e;}
  }
  throw last||new Error('no route to '+path);
}

/* Every trade carries the price it printed at, so the market cap at that
   moment is that price against the supply. Eight pages is more than the token
   has ever needed; the loop stops as soon as a page comes back short. */
async function pullSeries(){
  const [tok,cur]=await Promise.all([api('/token/'+TOKEN),api('/currency/btc')]);
  const supply=Number(tok.total_supply)/MS;
  const btcUsd=Number(cur.amount)||0;
  if(!(supply>0&&btcUsd>0))throw new Error('bad token or currency payload');

  let rows=[];
  for(let pg=1;pg<=8;pg++){
    const d=await api('/token/'+TOKEN+'/trades?limit=1000&page='+pg);
    const part=d.data||[];
    rows=rows.concat(part);
    if(!part.length||rows.length>=(d.count||0))break;
  }
  rows=rows.filter(r=>Number(r.price)>0&&r.time)
           .map(r=>({t:Date.parse(r.time),mc:Number(r.price)/MS*supply*btcUsd}))
           .filter(r=>Number.isFinite(r.t)&&Number.isFinite(r.mc))
           .sort((a,b)=>a.t-b.t);
  if(rows.length<8)throw new Error('too few trades');

  /* the head of the tape is the live number, whatever the last trade said */
  const liveMc=Number(tok.marketcap)/MS*btcUsd;
  if(Number.isFinite(liveMc)&&liveMc>0)rows.push({t:Date.now(),mc:liveMc});

  return {rows,n:rows.length,btcUsd,supply};
}

   the thinning that would otherwise average it away. */

  for(let i=0;i<want;i++){
    const a=t0+span*i/want, b=t0+span*(i+1)/want;
    let lo=null,hi=null,last=null;
    while(bi<rows.length&&rows[bi].t<b){
      const r=rows[bi];
      if(r.t>=a){ if(!lo||r.mc<lo.mc)lo=r; if(!hi||r.mc>hi.mc)hi=r; last=r; }
      bi++;
    }
    if(!last)continue;
    /* keep them in the order they happened, so a spike reads as a spike */
    const pair=(lo&&hi&&lo!==hi)?(lo.t<hi.t?[lo,hi]:[hi,lo]):[last];
    pair.forEach(p=>out.push(p));
  }
  if(!out.length)return rows.slice();
  if(out[out.length-1]!==rows[rows.length-1])out.push(rows[rows.length-1]);
  return out;
}

/* ================= the stage ================= */
/* Thirty-seven lines that each have to be read. At the old sixty seconds they
   went past faster than anyone could take them in, which is what the slower
   pace was asked for. */
const REPLAY=98000;
const MINSHOW=2400;                  /* what one line is owed, in ms */
/* Nothing grows until the cap has first printed this. Below the knee the
   number sits at its smallest the whole way up, which is the joke: every line
   on the road is aimed at a number too small to bother reading. */
const SZ_KNEE=2.0e5, SZ_HI=2e7, SZ_EXP=0.80;
const cv=$('#road'), g=cv.getContext('2d');
let dpr=1,cw=0,ch=0;

let series=null, meta=null, ATH=0;
let t0=0, playing=false, done=false, raf=0;
/* head is fractional and headT/headMc are where it actually is: the tape is
   thin in June and a head locked to a sample stands still for days. */
let head=0, headT=0, headMc=0, peak=0;
let mom=0, lastMc=0;
/* Everything the frame paints is a function of p alone, so RUN and MOM are
   worked out once and looked up. That is what lets the bar be dragged: a
   momentum smoothed frame by frame, or a high-water mark raised frame by
   frame, would both remember a place the drag has already left. */
let SCHED=[], RUN=[], MOM=[], sayIdx=-1;
/* the road is measured in time, so these are its two ends */
let T0=0, T1=1, headP=0;
let scrubbing=false, wasPlaying=false;
let liveTimer=0;

function fit(){
  const w=cv.clientWidth||600, h=cv.clientHeight||200;
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cw=w;ch=h;
}
addEventListener('resize',()=>{clearTimeout(fit.t);fit.t=setTimeout(()=>{fit();paint();},120);});

/* how many NOODL there are, so a cap can be turned back into a price */
let SUPPLY=0;
/* Four significant figures and no trailing zeros: a tenth of a cent still has
   to read as a number rather than as a row of noughts. */
const fmtPrice=v=>{
  if(!(v>0))return '$0';
  if(v>=1)return '$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const e=Math.floor(Math.log10(v));
  let t=v.toFixed(Math.min(12,Math.max(2,-e+3)));
  if(t.indexOf('.')>-1)t=t.replace(/0+$/,'').replace(/\.$/,'');
  return '$'+t;
};
/* the cap is still what the sizing and the anchors are measured in */
const priceOf=mc=>SUPPLY>0?mc/SUPPLY:0;
const fmtDate=ms=>{
  const d=new Date(ms);
  return lang==='zh' ? (d.getMonth()+1)+'月'+d.getDate()+'日'
                     : d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---- the schedule ----
   Where on the road each line gets said, worked out once from the tape. A day
   becomes a position by finding it in the series, so the lines keep their
   places as the road grows past them. */
function pOfDate(iso){
  const ms=Date.parse(iso+'T00:00:00Z');
  if(!Number.isFinite(ms))return null;
  return clamp((ms-T0)/Math.max(1,T1-T0),0,1);
}
/* which trade the road is standing on at time p */
function idxAt(p){
  const n=series.length, ms=T0+(T1-T0)*clamp(p,0,1);
  if(ms<=series[0].t)return 0;
  if(ms>=series[n-1].t)return n-1;
  let lo=0,hi=n-1;
  while(lo<hi){const m=(lo+hi)>>1;if(series[m].t<ms)lo=m+1;else hi=m;}
  return lo;
}
/* and where between two of them, so the head slides instead of stepping */
function atTime(p){
  const n=series.length, ms=T0+(T1-T0)*clamp(p,0,1);
  if(ms<=series[0].t)return {i:0,f:0,t:series[0].t,mc:series[0].mc};
  if(ms>=series[n-1].t)return {i:n-1,f:0,t:series[n-1].t,mc:series[n-1].mc};
  let lo=0,hi=n-1;
  while(lo<hi){const m=(lo+hi)>>1;if(series[m].t<ms)lo=m+1;else hi=m;}
  const j=Math.max(1,lo), a=series[j-1], b=series[j];
  const u=b.t>a.t?clamp((ms-a.t)/(b.t-a.t),0,1):0;
  return {i:j-1,f:u,t:ms,mc:a.mc+(b.mc-a.mc)*u};
}
function buildSchedule(){
  const n=series.length, out=[];
  for(let i=0;i<SAYS.length;i++){
    const s=SAYS[i];
    let p=null;
    /* a day the road has not reached is a line not said yet — without this,
       the clamp in pOfDate would say every postdated line today, at the end */
    if(s.d){const ms=Date.parse(s.d+'T00:00:00Z');p=(ms>T1)?null:pOfDate(s.d);}
    else if(s.dr){
      const a=pOfDate(s.dr[0]), b=pOfDate(s.dr[1]);
      if(a!=null&&b!=null)p=a+(b-a)*(s.k==null?0.5:s.k);
    }else if(s.p!=null)p=s.p;
    else if(s.mc!=null){
      /* a level the road has not reached: the line is not said yet. when it
         has been reached, the day it happened is what places the line. */
      let at=-1;
      for(let j=0;j<n;j++)if(series[j].mc>=s.mc){at=j;break;}
      p=at<0?null:clamp((series[at].t-T0)/Math.max(1,T1-T0),0,1);
    }
    if(p==null)continue;
    out.push({s,p:clamp(p,0,1)});
  }
  out.sort((a,b)=>a.p-b.p);
  /* Nothing may flash past unread. Push each line clear of the one before it
     by what it is owed — and the four that contradict each other in the flat
     stretch are owed less on purpose, because tripping over one another is the
     whole point of them. */
  /* Two passes, not one. Pushing only forwards piles the overflow onto the end
     of the road, and shifting the whole lot back to fit moved every line off
     the day it belongs to — 23 June came out as 20 June. Pushing forward and
     then, if it still runs off the end, backward from the end, borrows room
     only from the stretches that have some. */
  const gap=MINSHOW/REPLAY, gapOf=i=>out[i].s.fast?gap*0.5:gap;
  for(let pass=0;pass<4;pass++){
    for(let i=1;i<out.length;i++)
      if(out[i].p<out[i-1].p+gapOf(i))out[i].p=out[i-1].p+gapOf(i);
    if(out[out.length-1].p<=1)break;
    out[out.length-1].p=1;
    for(let i=out.length-2;i>=0;i--)
      if(out[i].p>out[i+1].p-gapOf(i+1))out[i].p=out[i+1].p-gapOf(i+1);
    if(out[0].p>=0)break;
    out[0].p=0;
  }
  return out;
}
/* the last line whose moment has come */
function sayAt(p){
  let k=-1;
  for(let i=0;i<SCHED.length;i++){if(SCHED[i].p<=p)k=i;else break;}
  return k;
}
function showSay(k,snap){
  if(k===sayIdx)return;
  sayIdx=k;
  const box=$('#says');
  const old=box.querySelector('.q.on');
  if(old){
    if(snap){old.remove();}
    else{old.classList.remove('on');old.classList.add('out');
      setTimeout(()=>{if(old.parentNode)old.remove();},400);}
  }
  /* a drag can cross a dozen lines in a second; fading each of them in over
     450ms just piles them on one another */
  box.classList.toggle('snap',!!snap);
  if(k<0)return;
  const s=SCHED[k].s;
  const el=document.createElement('div');
  el.className='q';
  el.innerHTML='<div><b>“'+esc(lang==='zh'?s.zh:s.en)+'”</b></div>';
  box.appendChild(el);
  void el.offsetWidth;
  el.classList.add('on');
}

/* ---- the number ---- */
/* Flat below the knee, then logarithmic to twenty million. Two hundred and
   some thousand lands a sixth of the way up, so it does grow — visibly, once
   — and still ends the replay small with nearly all the room above it. */
function szOf(mc){
  if(!(mc>SZ_KNEE))return 0;
  const u=Math.log(mc/SZ_KNEE)/Math.log(SZ_HI/SZ_KNEE);
  return Math.pow(clamp(u,0,1),SZ_EXP);
}
function paintNum(mc,at,hi){
  const el=$('#mc');
  /* Driven by the high-water mark, never by the current price: it grows out of
     a small start and a fall only stops it. A number that shrank on every dip
     bounced about and read as noise rather than as a road. Nothing here reads
     momentum, so there is no kick either — only the colour still moves. */
  const wide=($('#stage').clientWidth)||900;
  const maxPx=clamp(wide*0.20,46,112), minPx=clamp(wide*0.030,15,20);
  const px=minPx+(maxPx-minPx)*szOf(hi==null?mc:hi);
  el.style.fontSize=clamp(px,15,120).toFixed(1)+'px';
  const up=mom>=0;
  const k=Math.min(1,Math.abs(mom)*4);
  const mix=(a,b)=>Math.round(a+(b-a)*k);
  el.style.color = up
    ? 'rgb('+mix(185,34)+','+mix(188,209)+','+mix(201,140)+')'
    : 'rgb('+mix(185,255)+','+mix(188,77)+','+mix(201,77)+')';
  el.textContent=fmtPrice(priceOf(mc));
  $('#when').textContent=at?fmtDate(at):'';
}

/* ECG paper, baked once: a fine grid with a heavier line every fifth. Two
   hundred strokes a frame is a waste when the thing never changes. */
let gridCv=null,gridKey='';
function gridFor(w,h){
  const key=w+'x'+h+'x'+dpr;
  if(gridCv&&gridKey===key)return gridCv;
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*dpr));c.height=Math.max(1,Math.round(h*dpr));
  const q=c.getContext('2d');
  q.setTransform(dpr,0,0,dpr,0,0);
  const CELL=11;
  q.lineWidth=1;
  for(let k=0;k*CELL<=w;k++){
    q.strokeStyle=(k%5)?'rgba(120,124,142,.05)':'rgba(120,124,142,.10)';
    const x=Math.round(k*CELL)+0.5;
    q.beginPath();q.moveTo(x,0);q.lineTo(x,h);q.stroke();
  }
  for(let k=0;k*CELL<=h;k++){
    q.strokeStyle=(k%5)?'rgba(120,124,142,.05)':'rgba(120,124,142,.10)';
    const y=Math.round(k*CELL)+0.5;
    q.beginPath();q.moveTo(0,y);q.lineTo(w,y);q.stroke();
  }
  gridCv=c;gridKey=key;return c;
}

/* ---- the monitor ---- */
function paint(){
  if(!series||!cw)return;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,cw,ch);
  const PADT=12,PADB=20,PADL=6;
  /* A price is eleven characters at its longest, and a phone is 330 pixels
     wide: measure it rather than guess, or the gutter eats a quarter of the
     panel on a phone and still clips it on a desktop. */
  const n0=series.length;
  const hi0=Math.min(n0-1,Math.max(0,Math.floor(head)));
  const athV=series.reduce((m,r)=>Math.max(m,r.mc),0);
  const lblH=fmtPrice(priceOf(headMc||series[hi0].mc)), lblA=fmtPrice(priceOf(athV));
  const FS=cw<420?9.5:11;
  g.font='700 '+FS+'px "Work Sans",sans-serif';
  const PADR=clamp(Math.max(g.measureText(lblH).width,g.measureText(lblA).width)+14,44,96);
  const W=cw-PADL-PADR, H=ch-PADT-PADB;
  const n=n0;
  const top=Math.max(peak, series.reduce((m,r)=>Math.max(m,r.mc),0))*1.06;
  /* A power scale, and the exponent is the whole argument between the two
     halves of this page: nearer 1 and the first five weeks lie flat on the
     floor, which on a heart monitor reads as dead; nearer 0 and July stops
     being a leap. 0.52 gives June a visible pulse and still throws the launch
     three fifths of the way up the panel. */
  const yOf=v=>PADT+H-H*Math.pow(clamp(v,0,top)/top,0.52);
  /* by time, not by trade: a quiet June is still five weeks wide, and the
     head of the line then sits under the same fraction the bar shows */
  const span=Math.max(1,T1-T0);
  const xAt=ms=>PADL+W*clamp((ms-T0)/span,0,1);
  const xOf=i=>xAt(series[i].t);

  g.drawImage(gridFor(W,H),PADL,PADT,W,H);

  /* the whole road, faint: where it has been and where it is going */
  g.strokeStyle='rgba(120,124,142,.13)';g.lineWidth=1.1;g.lineJoin='round';g.lineCap='round';
  g.beginPath();
  for(let i=0;i<n;i++){const x=xOf(i),y=yOf(series[i].mc);i?g.lineTo(x,y):g.moveTo(x,y);}
  g.stroke();

  /* the part it has walked, ending wherever between two samples it actually
     is — a head that snapped to a sample stood still for days in June */
  const hi=hi0;
  const hx=xAt(headT||series[hi].t), hy=yOf(headMc||series[hi].mc);
  const up=mom>=0;
  const col=up?'#22d18c':'#ff4d4d';
  const rgb=up?'34,209,140':'255,77,77';
  const trace=()=>{
    g.beginPath();
    for(let i=0;i<=hi;i++){const x=xOf(i),y=yOf(series[i].mc);i?g.lineTo(x,y):g.moveTo(x,y);}
    g.lineTo(hx,hy);
    g.stroke();
  };
  /* the phosphor: three passes rather than a shadow, because Safari's canvas
     filter is off the table and a blur every frame is not worth it */
  g.lineJoin='round';g.lineCap='round';
  g.strokeStyle='rgba('+rgb+',.10)';g.lineWidth=7;trace();
  g.strokeStyle='rgba('+rgb+',.26)';g.lineWidth=3.4;trace();
  g.strokeStyle=col;g.lineWidth=1.7;trace();

  /* the level it is at */
  g.strokeStyle='rgba(250,250,250,.10)';g.lineWidth=1;g.setLineDash([3,6]);
  g.beginPath();g.moveTo(PADL,hy);g.lineTo(cw-PADR+4,hy);g.stroke();g.setLineDash([]);

  /* and the beat itself */
  const bt=(typeof performance!=='undefined'?performance.now():0)/1000;
  const pu=0.5+0.5*Math.sin(bt*4.4);
  g.fillStyle='rgba('+rgb+','+(0.16+0.20*pu).toFixed(3)+')';
  g.beginPath();g.arc(hx,hy,7+5*pu,0,6.2832);g.fill();
  g.fillStyle='rgba('+rgb+','+(0.28+0.24*pu).toFixed(3)+')';
  g.beginPath();g.arc(hx,hy,4.6+2.2*pu,0,6.2832);g.fill();
  g.fillStyle=col;
  g.beginPath();g.arc(hx,hy,3.4,0,6.2832);g.fill();
  g.strokeStyle='rgba(13,14,19,.9)';g.lineWidth=1.6;g.stroke();

  g.fillStyle=col;
  g.font='700 '+FS+'px "Work Sans",sans-serif';g.textBaseline='middle';g.textAlign='left';
  g.fillText(lblH,cw-PADR+9,hy);

  /* the all-time high, so the road has a ceiling to be measured against */
  const ay=yOf(athV);
  if(Math.abs(ay-hy)>13){
    g.strokeStyle='rgba(252,209,79,.20)';g.lineWidth=1;g.setLineDash([2,6]);
    g.beginPath();g.moveTo(PADL,ay);g.lineTo(cw-PADR+4,ay);g.stroke();g.setLineDash([]);
    g.fillStyle='rgba(252,209,79,.65)';
    g.fillText(lblA,cw-PADR+9,ay);
  }

  /* the ends of the road */
  g.fillStyle='rgba(107,109,124,.9)';g.textAlign='left';
  g.font='600 10.5px "Work Sans",sans-serif';
  g.fillText(fmtDate(series[0].t),PADL,ch-8);
  g.textAlign='right';
  g.fillText(I18N[lang].noteEnd,cw-PADR,ch-8);
}
window.__repaint=()=>{if(series)seek(headP,true);};

/* ---- the run ----
   One place decides what the whole stage shows, and it takes one number. The
   clock calls it, and so does a finger on the bar. */
function seek(p,snap){
  if(!series)return;
  p=clamp(p,0,1);
  headP=p;
  const at=atTime(p), i=at.i;
  head=i+at.f; headT=at.t; headMc=at.mc;
  const mc=at.mc;
  lastMc=mc;
  mom=MOM[i]||0;
  paintNum(mc,at.t,Math.max(RUN[i]||0,mc));
  paint();
  setProg(p);
  showSay(sayAt(p),!!snap);
  tone(mc,mom,p);
}
function setProg(p){
  const w=(p*100).toFixed(2)+'%';
  $('#prog').style.width=w;
  const k=$('#knob');if(k)k.style.left=w;
  const sc=$('#scrub');
  if(sc)sc.setAttribute('aria-valuenow',String(Math.round(p*100)));
}
function frame(now){
  if(!raf)return;
  try{
    const p=clamp((now-t0)/REPLAY,0,1);
    seek(p,false);
    if(p>=1){finish();return;}
  }catch(e){raf=0;window.__roadErr=String(e&&e.stack||e);console.error(e);return;}
  raf=requestAnimationFrame(frame);
}
function start(){playFrom(0);}
function playFrom(p){
  if(!series)return;
  stopRaf();
  done=false;playing=true;
  sayIdx=-2;                          /* force the first line to be rendered */
  $('#says').innerHTML='';
  $('#btnPlay').textContent=I18N[lang].btnStop;
  t0=performance.now()-clamp(p,0,1)*REPLAY;
  seek(p,true);
  raf=requestAnimationFrame(frame);
}
function pause(){
  stopRaf();playing=false;
  $('#btnPlay').textContent=I18N[lang].btnReplay;
  quiet();
}
function stopRaf(){if(raf){cancelAnimationFrame(raf);raf=0;}}
function finish(){
  stopRaf();
  playing=false;done=true;
  head=series.length-1;
  headT=series[series.length-1].t; headMc=series[series.length-1].mc;
  $('#btnPlay').textContent=I18N[lang].btnReplay;
  headP=1;seek(1,false);
  quiet();
}

/* ---- a note that follows the price, rather than a track ripped off a video ----
   The reference clip has music on it that belongs to whoever made it, so this
   builds its own: a slow pulse whose brightness rides the same momentum the
   number does. Off until asked for, because sound nobody asked for is rude. */
/* on unless switched off: the page wants to be heard, and the only thing in
   the way is a browser that will not open a context until something is
   touched. armed says the intent, soundOn says whether it is actually out. */
let AC=null,master=null,soundOn=false,armed=true,said=false;
let pad=null,thudAt=0,hiHeard=0;
function audio(){
  if(AC)return AC;
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  AC=new C();
  /* iOS wants to hear something come out of the context inside the gesture
     that made it, or the audio session never actually opens. One sample of
     nothing is enough to ask. */
  try{
    const b=AC.createBuffer(1,1,22050), sN=AC.createBufferSource();
    sN.buffer=b;sN.connect(AC.destination);sN.start(0);
  }catch(e){}
  AC.onstatechange=()=>{if(soundOn&&AC.state!=='running')AC.resume().catch(()=>{});};
  master=AC.createGain();master.gain.value=0.0001;master.connect(AC.destination);

  /* A long delay standing in for a hall. Something this slow needs somewhere
     to sit, and a real convolver would want an impulse file this page is not
     going to ship. */
  const dly=AC.createDelay(1.5), fb=AC.createGain(), damp=AC.createBiquadFilter(), wet=AC.createGain();
  dly.delayTime.value=0.44;fb.gain.value=0.40;
  damp.type='lowpass';damp.frequency.value=1700;
  wet.gain.value=0.32;
  master.connect(dly);dly.connect(damp);damp.connect(fb);fb.connect(dly);
  damp.connect(wet);wet.connect(AC.destination);

  /* The pad is built once and left running for the whole replay. Starting a
     fresh oscillator every note is what made the old one a bleep, and over
     ninety seconds it would also have left hundreds of dead nodes behind. */
  pad={g:AC.createGain(),lp:AC.createBiquadFilter(),osc:[]};
  pad.g.gain.value=0.0001;
  pad.lp.type='lowpass';pad.lp.frequency.value=260;pad.lp.Q.value=0.8;
  pad.g.connect(pad.lp);pad.lp.connect(master);
  /* root, fifth, octave, and a twelfth on top: open intervals, no third, so it
     stays wide rather than sad or triumphant */
  [[0,0.50],[7,0.32],[12,0.24],[19,0.12]].forEach((v,i)=>{
    const o=AC.createOscillator(), og=AC.createGain();
    o.type='sawtooth';
    o.frequency.value=55*Math.pow(2,v[0]/12);
    o.detune.value=(i-1.5)*6;
    og.gain.value=v[1];
    o.connect(og);og.connect(pad.g);
    o.start();
    pad.osc.push(o);
  });
  return AC;
}
/* The bed rides the same 0..1 the number grows on, so the room opens up as the
   road climbs and closes when it stalls. */
function tone(mc,m,p){
  if(!soundOn||!AC||!pad)return;
  const now=AC.currentTime, t=szOf(mc);
  pad.g.gain.setTargetAtTime(0.05+0.09*t,now,0.7);
  pad.lp.frequency.setTargetAtTime(240+2200*t+(m>0?420*m:0),now,0.6);
  for(let i=0;i<pad.osc.length;i++)
    pad.osc[i].detune.setTargetAtTime((i-1.5)*6+(m<0?-16:5),now,1.4);

  if(now-thudAt>2.1){                     /* a slow heart under all of it */
    thudAt=now;
    const o=AC.createOscillator(), gg=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(98,now);
    o.frequency.exponentialRampToValueAtTime(36,now+0.32);
    gg.gain.setValueAtTime(0.0001,now);
    gg.gain.exponentialRampToValueAtTime(0.30+0.26*t,now+0.014);
    gg.gain.exponentialRampToValueAtTime(0.0001,now+0.62);
    o.connect(gg);gg.connect(master);
    o.start(now);o.stop(now+0.66);
    o.onended=()=>{try{o.disconnect();gg.disconnect();}catch(e){}};
  }
  if(mc>hiHeard*1.06&&mc>8e3){            /* and a bell at every new high */
    hiHeard=mc;
    const o=AC.createOscillator(), gg=AC.createGain();
    o.type='triangle';
    o.frequency.value=659.25*Math.pow(2,Math.round(t*5)/12);
    gg.gain.setValueAtTime(0.0001,now);
    gg.gain.exponentialRampToValueAtTime(0.075,now+0.03);
    gg.gain.exponentialRampToValueAtTime(0.0001,now+1.8);
    o.connect(gg);gg.connect(master);
    o.start(now);o.stop(now+1.85);
    o.onended=()=>{try{o.disconnect();gg.disconnect();}catch(e){}};
  }
}
function quiet(){
  if(!AC||!master)return;
  master.gain.setTargetAtTime(0.0001,AC.currentTime,0.5);
}
/* one second of digital silence, made here rather than shipped */
let keeper=null,keeperURL=null;
function silentURL(){
  if(keeperURL)return keeperURL;
  const sr=8000,n=sr;
  const buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const W=(o,txt)=>{for(let i=0;i<txt.length;i++)v.setUint8(o+i,txt.charCodeAt(i));};
  W(0,'RIFF');v.setUint32(4,36+n*2,true);W(8,'WAVEfmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  W(36,'data');v.setUint32(40,n*2,true);
  keeperURL=URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
  return keeperURL;
}
function keepAwake(on){
  try{
    if(on){
      if(!keeper){keeper=new Audio();keeper.loop=true;keeper.preload='auto';keeper.src=silentURL();}
      const pr=keeper.play();if(pr&&pr.catch)pr.catch(()=>{});
    }else if(keeper){keeper.pause();}
  }catch(e){}
}
/* A context that was running before the phone locked comes back suspended and
   stays that way for ever unless somebody asks. Ask on the way back, and ask
   again on the next thing the finger touches. */
function wake(){
  if(!armed||!AC||!soundOn)return;
  if(AC.state!=='running')AC.resume().catch(()=>{});
  keepAwake(true);
}
addEventListener('pointerdown',wake,{passive:true});
addEventListener('touchend',wake,{passive:true});
function soundBtn(){
  const b=$('#btnSound');if(!b)return;
  b.textContent=I18N[lang][armed?'btnMute':'btnUnmute'];
  b.classList.toggle('on',!armed);
  b.setAttribute('aria-pressed',armed?'false':'true');
}
/* bring it up. safe to call as often as you like; it only ever does the work
   once the browser is actually willing. */
function soundUp(){
  if(!armed||soundOn)return;
  const ac=audio();
  if(!ac){armed=false;const b=$('#btnSound');if(b)b.disabled=true;soundBtn();return;}
  const up=()=>{
    if(!armed)return;
    if(AC.state!=='running')return;      /* still blocked; the next touch tries again */
    soundOn=true;hiHeard=0;thudAt=0;
    keepAwake(true);
    master.gain.setTargetAtTime(0.42,AC.currentTime,0.9);
    if(series)tone(headMc||series[series.length-1].mc,mom,headP);
    if(!said){said=true;hint();}
  };
  if(ac.state!=='running'){const pr=ac.resume();(pr&&pr.then?pr:Promise.resolve()).then(up,up);}
  else up();
}
function soundDown(){soundOn=false;quiet();keepAwake(false);}
$('#btnSound').addEventListener('click',()=>{
  armed=!armed;
  if(armed)soundUp(); else soundDown();
  soundBtn();
});
/* the first thing the finger or the key touches is the permission the browser
   was waiting for, whatever it happened to be aimed at */
['pointerdown','keydown','touchend'].forEach(ev=>
  addEventListener(ev,()=>{if(armed&&!soundOn)soundUp();},{passive:true}));
/* and try straight away, in case this browser does not need asking */
soundBtn();
setTimeout(soundUp,0);
/* The one cause we cannot do anything about: on an iPhone the side switch
   mutes web audio outright. Better to say so than to let it read as broken. */
function hint(){
  if(!(navigator.maxTouchPoints>0))return;
  const n=$('#snote');if(!n)return;
  n.textContent=I18N[lang].sndHint;
  clearTimeout(hint._t);
  hint._t=setTimeout(()=>{n.textContent='';},7000);
}

$('#btnPlay').addEventListener('click',()=>{
  if(playing)pause();
  /* the button at the end means "again"; part way along it means "carry on" */
  else if(done||headP<=0)start();
  else playFrom(headP);
});

/* ---- the bar, which is now a place you can go ---- */
(function(){
  const sc=$('#scrub');
  if(!sc)return;
  const pOf=ev=>{
    const r=sc.getBoundingClientRect();
    return r.width>0?clamp((ev.clientX-r.left)/r.width,0,1):0;
  };
  const grab=ev=>{
    if(!series)return;
    ev.preventDefault();
    scrubbing=true;wasPlaying=playing;
    if(playing)pause();
    try{sc.setPointerCapture(ev.pointerId);}catch(e){}
    done=false;
    seek(pOf(ev),true);
  };
  sc.addEventListener('pointerdown',grab);
  sc.addEventListener('pointermove',ev=>{if(scrubbing)seek(pOf(ev),true);});
  const drop=ev=>{
    if(!scrubbing)return;
    scrubbing=false;
    try{sc.releasePointerCapture(ev.pointerId);}catch(e){}
    /* carry on from where it was let go, if it was moving when it was grabbed */
    if(wasPlaying)playFrom(headP);
  };
  sc.addEventListener('pointerup',drop);
  sc.addEventListener('pointercancel',drop);
  sc.addEventListener('keydown',ev=>{
    if(!series)return;
    const p=headP;
    let np=null;
    if(ev.key==='ArrowRight'||ev.key==='ArrowUp')np=p+0.01;
    else if(ev.key==='ArrowLeft'||ev.key==='ArrowDown')np=p-0.01;
    else if(ev.key==='PageUp')np=p+0.08;
    else if(ev.key==='PageDown')np=p-0.08;
    else if(ev.key==='Home')np=0;
    else if(ev.key==='End')np=1;
    if(np==null)return;
    ev.preventDefault();
    if(playing)pause();
    done=false;
    seek(clamp(np,0,1),true);
  });
})();

/* ---- boot ---- */
function say(h,p,retry){
  $('#state').hidden=false;
  $('#stateH').textContent=h;
  $('#stateP').textContent=p;
  $('#stateP').classList.toggle('dots',!retry);
  $('#btnRetry').hidden=!retry;
}
/* everything a new tape needs rebuilt, in one place, so the seed, the legacy
   fetch and the mid-play splice cannot drift apart */
function applySeries(rows){
  series=thin(rows,700);
  T0=series[0].t;T1=series[series.length-1].t;
  ATH=series.reduce((m,r)=>Math.max(m,r.mc),0);
  peak=ATH;
  /* the two lookups a drag needs: what the highest was by each point, and how
     hard it was moving there */
  RUN=[];MOM=[];
  let run=0,sm=0;
  for(let i=0;i<series.length;i++){
    run=Math.max(run,series[i].mc);RUN.push(run);
    const back=series[Math.max(0,i-12)].mc;
    const d=back>0?(series[i].mc-back)/back:0;
    sm=sm*0.84+d*0.16;
    MOM.push(clamp(sm*7,-1,1));
  }
  SCHED=buildSchedule();
  paint();
}
async function boot(){
  const ui=I18N[lang];
  fit();
  /* the baked tape first: the road is rolling before any request is made */
  try{
    SUPPLY=SEED.s;
    applySeries(decodeSeed());
    $('#state').hidden=true;
    start();
    refresh();
    return;
  }catch(e){window.__roadErr='seed: '+String(e&&e.message||e);}
  /* only a corrupt seed lands here: the old full fetch, with its old card */
  say(ui.loadH,ui.loadP,false);
  let data=null;
  try{
    data=await pullSeries();
  }catch(e){
    say(ui.errH,ui.errP,true);
    window.__roadErr=String(e&&e.message||e);
    return;
  }
  SUPPLY=Number(data.supply)||SUPPLY;
  applySeries(data.rows);
  $('#state').hidden=true;
  start();
  armLive();
}
/* What the network is for now: only the stretch the seed has not seen. Walk
   the newest pages until one reaches back past the seed's last day, rescale
   the baked dollars to today's BTC rate so the seam is not a step, splice,
   rebuild. All of it lands while the replay is still down in June. */
async function refresh(){
  try{
    const [tok,cur]=await Promise.all([api('/token/'+TOKEN),api('/currency/btc')]);
    const supply=Number(tok.total_supply)/MS, usd=Number(cur.amount)||0;
    if(!(supply>0&&usd>0))throw new Error('bad payload');
    let raw=[];
    for(let pg=1;pg<=8;pg++){
      const d=await api('/token/'+TOKEN+'/trades?limit=1000&page='+pg);
      const part=d.data||[];
      raw=raw.concat(part);
      if(!part.length||raw.length>=(d.count||0))break;
      let oldest=Infinity;
      for(const r of part){const ms=Date.parse(r.time);if(Number.isFinite(ms)&&ms<oldest)oldest=ms;}
      if(oldest<=SEED.e)break;             /* this page reaches the seed */
    }
    const tail=raw.filter(r=>Number(r.price)>0&&r.time)
      .map(r=>({t:Date.parse(r.time),mc:Number(r.price)/MS*supply*usd}))
      .filter(r=>Number.isFinite(r.t)&&Number.isFinite(r.mc)&&r.t>SEED.e)
      .sort((a,b)=>a.t-b.t);
    const k=usd/SEED.u;
    const rows=decodeSeed().map(r=>({t:r.t,mc:r.mc*k})).concat(tail);
    const liveMc=Number(tok.marketcap)/MS*usd;
    if(Number.isFinite(liveMc)&&liveMc>0)rows.push({t:Date.now(),mc:liveMc});
    SUPPLY=supply;
    applySeries(rows);
    if(done)seek(1,true);
  }catch(e){
    /* stale is fine: the seed keeps playing, and the next visit tries again */
    window.__roadErr='refresh: '+String(e&&e.message||e);
  }
  armLive();
}
function armLive(){
  /* once it has caught up, keep the head on the live number */
  clearInterval(liveTimer);
  liveTimer=setInterval(async()=>{
    if(!done)return;
    try{
      const [tok,cur2]=await Promise.all([api('/token/'+TOKEN),api('/currency/btc')]);
      const supply=Number(tok.total_supply)/MS, usd=Number(cur2.amount)||0;
      if(supply>0)SUPPLY=supply;
      const mc=Number(tok.marketcap)/MS*usd;
      if(!(mc>0&&supply>0&&usd>0))return;
      const prev=series[series.length-1].mc;
      series[series.length-1]={t:Date.now(),mc};
      T1=series[series.length-1].t;
      peak=Math.max(peak,mc);
      RUN[RUN.length-1]=Math.max(RUN[RUN.length-2]||0,mc);
      mom=clamp((mc-prev)/Math.max(1,prev)*40,-1,1);
      MOM[MOM.length-1]=mom;
      paintNum(mc,Date.now(),RUN[RUN.length-1]);paint();
    }catch(e){}
  },20000);
}
$('#btnRetry').addEventListener('click',boot);
window.__roadRefresh=refresh;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(soundOn)quiet();return;}
  if(!soundOn||!AC)return;
  const up=()=>master.gain.setTargetAtTime(0.42,AC.currentTime,0.4);
  if(AC.state!=='running'){const pr=AC.resume();(pr&&pr.then?pr:Promise.resolve()).then(up,up);}
  else up();
  keepAwake(true);
});

window.__road={start,boot,seek,playFrom,pause,
  get series(){return series;},get head(){return head;},get headP(){return headP;},
  get playing(){return playing;},get done(){return done;},
  get sched(){return SCHED;},get sayIdx(){return sayIdx;}};
boot();
})();
applyLang();
</script>
