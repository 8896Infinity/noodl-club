*{margin:0;padding:0;box-sizing:border-box}

  background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px;

  display:inline-block;margin-top:20px;background:var(--cyan);color:#06060a;font-weight:600;font-size:13.5px;
  padding:9px 18px;border-radius:6px;text-decoration:none;
