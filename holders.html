<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holder board · NOODL.club</title>
<meta name="description" content="Every NOODL holder, their share, cost basis and unrealised P&L, plus the liquidity pool and its fee yield — read live from the odin.fun API.">
<meta name="theme-color" content="#111117">
<meta name="robots" content="index,follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='0.9em'%20font-size='90'%3E%F0%9F%8D%9C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Same palette as index.html — taken from odin.fun's own computed styles. */
:root{
  --bg:#111117;--panel:#18181d;--line:#27272a;--line-soft:#1f1f25;
  --cyan:#00ffff;--cyan-dim:#00c9c9;--text:#fafafa;--text-2:#a8aab8;
  --dim:#6b6d7c;--up:#3ddc84;--down:#ff6b6b;--noodle-y:#fcd14f;--noodle-o:#ef9530;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  font-family:'Work Sans','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;
}
a{color:inherit}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#stars i{position:absolute;border-radius:1.5px;animation:tw linear infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}

.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:18px 18px 60px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.wordmark{font-weight:700;font-size:16px;letter-spacing:.14em;color:var(--cyan);text-decoration:none;display:flex;align-items:center;gap:8px}
.topnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  font-family:inherit;font-weight:500;font-size:12.5px;letter-spacing:.02em;cursor:pointer;
  color:var(--text-2);text-decoration:none;background:transparent;
  border:1px solid var(--line);border-radius:6px;padding:6px 12px;
  transition:border-color .15s,color .15s,background .15s;
}
.btn:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,255,255,.06)}
/* the page you are on, lit the same way the other two pages light theirs */
.btn.on{color:var(--cyan);border-color:rgba(0,255,255,.5);background:rgba(0,255,255,.08);font-weight:600}
#langBtn{color:var(--cyan);border-color:rgba(0,255,255,.35)}

h1{font-weight:800;font-size:clamp(26px,5.5vw,38px);line-height:1.06;letter-spacing:.01em}

/* live pulse: solid while data is fresh, hollow while a refresh is in flight */
.live{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;
  letter-spacing:.1em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.live b{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 8px rgba(61,220,132,.8)}
.live.busy b{background:transparent;border:1.5px solid var(--noodle-y);box-shadow:none;animation:sp .9s linear infinite}
.live.fail b{background:var(--down);box-shadow:0 0 8px rgba(255,107,107,.8)}
@keyframes sp{to{transform:rotate(360deg)}}

.band{margin-top:26px}
.band-k{font-size:10.5px;font-weight:700;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(152px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 13px}
.stat-l{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--dim);line-height:1.35}
.stat-v{font-size:20px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15}
.stat-s{font-size:11px;color:var(--text-2);margin-top:3px;font-variant-numeric:tabular-nums}
/* a bucket that cannot be filled yet is not a zero, it is a clock */
.stat.pending .stat-v{color:var(--dim)}
.stat-n{font-size:10.5px;color:var(--noodle-y);margin-top:5px;line-height:1.45}
.up{color:var(--up)}.down{color:var(--down)}.cy{color:var(--cyan)}

.tools{display:flex;align-items:center;gap:8px;margin:26px 0 12px;flex-wrap:wrap}
.tools .lbl{font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--dim)}
.sort{font-family:inherit;font-weight:500;font-size:12.5px;cursor:pointer;background:transparent;
  color:var(--text-2);border:1px solid var(--line);border-radius:6px;padding:6px 13px;transition:all .15s}
.sort:hover{color:var(--cyan);border-color:var(--cyan)}
.sort[aria-pressed="true"]{background:var(--cyan);color:#06060a;border-color:var(--cyan);font-weight:600}
#q{font-family:inherit;font-size:12.5px;color:var(--text);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:6px 11px;min-width:150px}
#q:focus{outline:none;border-color:var(--cyan)}
#q::placeholder{color:var(--dim)}
.count{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}

/* the table is the widest thing here, so it scrolls inside its own box
   instead of making the whole page scroll sideways on a phone */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:930px;font-variant-numeric:tabular-nums}
th,td{padding:9px 11px;text-align:right;white-space:nowrap;font-size:12.5px;border-bottom:1px solid var(--line-soft)}
th{position:sticky;top:0;z-index:1;background:#15151b;font-size:10.5px;font-weight:700;letter-spacing:.08em;
  color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:center;color:var(--dim);width:44px}
th:nth-child(2),td:nth-child(2){text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#1c1c22}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.av{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--line);color:var(--text-2);font-size:10px;font-weight:700}
.nm{max-width:190px;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.nm a{text-decoration:none}
.nm a:hover{color:var(--cyan)}
.tags{display:inline-flex;gap:4px;flex-wrap:wrap}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.07em;padding:2px 6px;border-radius:4px;line-height:1.5}
.tag.noodler{color:var(--cyan);border:1px solid rgba(0,255,255,.4);background:rgba(0,255,255,.07)}
.tag.chef{color:var(--noodle-y);border:1px solid rgba(252,209,79,.42);background:rgba(252,209,79,.08)}
.pend{color:var(--dim)}
/* share bar behind the percentage, so the whale shape is readable at a glance */
.shr{position:relative;display:inline-block;min-width:52px}
.shr i{position:absolute;right:0;bottom:-3px;height:2px;background:var(--cyan);opacity:.5;border-radius:1px}

/* an author `display` beats the UA stylesheet's [hidden]{display:none} whatever
   the specificity, so hiding it has to be spelled out here */
.prog{margin:10px 0 0;font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:9px}
.prog[hidden]{display:none}
.prog .bar{flex:1;max-width:220px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--noodle-y);border-radius:2px;transition:width .3s linear}

/* ---------- chart ---------- */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px 11px}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{
  font-family:inherit;font-size:11.5px;font-weight:500;cursor:pointer;white-space:nowrap;
  background:transparent;color:var(--text-2);border:none;padding:5px 10px;transition:all .13s;
}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--cyan)}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#06060a;font-weight:600}
.creadout{margin-left:auto;font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.creadout b{color:var(--text);font-weight:600}
/* the SVGs stretch to the container and are drawn in their own viewBox units,
   so nothing here depends on measuring the DOM before the first paint */
.chart svg{display:block;width:100%;height:240px;overflow:visible}
/* volume sits directly under the price line and shares its x scale, so it gets
   no top margin and the same left/right padding */
#cVol{height:64px;margin-top:2px}
.cbar{shape-rendering:crispEdges}
.cbar.up{fill:var(--up);opacity:.5}
.cbar.down{fill:var(--down);opacity:.5}
.cmini{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.cmini svg{height:90px}
.cmini-k{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-bottom:4px}
.cmini-k b{font-size:12.5px;font-weight:600;letter-spacing:0;color:var(--text);
  text-transform:none;font-variant-numeric:tabular-nums}
.cgrid{stroke:var(--line-soft);stroke-width:1}
.cline{fill:none;stroke:var(--cyan);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.cline.gold{stroke:var(--noodle-y)}
.carea{stroke:none}
.cdot{fill:var(--cyan);stroke:var(--bg);stroke-width:2}
.cdot.gold{fill:var(--noodle-y)}
.cx{stroke:var(--dim);stroke-width:1;stroke-dasharray:2 3}
.clab{fill:var(--dim);font-size:9.5px;font-family:inherit}
.cempty{fill:var(--dim);font-size:11px;font-family:inherit}
.cnote{font-size:10.5px;color:var(--dim);line-height:1.6;margin-top:9px}
@media (max-width:620px){
  .cmini{grid-template-columns:1fr}
  .chart svg{height:190px}
  .creadout{margin-left:0;width:100%}
}

.note{margin-top:30px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:15px 17px}
.note h2{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.note li{list-style:none;font-size:12.5px;color:var(--text-2);line-height:1.75;padding-left:15px;position:relative;margin-bottom:7px}
.note li:before{content:'';position:absolute;left:0;top:9px;width:5px;height:1px;background:var(--dim)}
.note li b{color:var(--text);font-weight:600}
.note li:last-child{margin-bottom:0}
/* endpoint and field names are quoted verbatim, so they get to look like code */
.note code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11.5px;color:var(--cyan-dim);background:#15151b;
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;
  white-space:nowrap;
}

footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--dim);line-height:1.8;text-align:center}
footer a{color:var(--cyan-dim);text-decoration:none}
footer a:hover{color:var(--cyan)}
.err{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);color:#ffb3b3;
  border-radius:8px;padding:11px 14px;font-size:12.5px;margin-top:16px}
@media (max-width:560px){
  .stat-v{font-size:17px}
  .grid{grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  #stars i,.live.busy b{animation:none}
  .prog .bar i{transition:none}
}
</style>
</head>

let metric='mc',tf='1h';

/* ================= helpers ================= */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(v,d)=>Number(v).toLocaleString(lang==='zh'?'zh-CN':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
/* NOODL trades around a cent, so a flat 2 decimals would print every price and
   every cost basis as "$0.01". Precision follows the magnitude instead. */
function fmtUsd(v){
  const a=Math.abs(v);
  if(a>=1e6)return '$'+nf(v/1e6,2)+'M';
  if(a>=1000)return '$'+nf(v/1000,1)+'k';
  if(a>=100)return '$'+nf(v,0);
  if(a>=1)return '$'+nf(v,2);
  if(a>=0.01)return '$'+nf(v,4);
  if(a>=1e-6)return '$'+nf(v,6);
  return a===0?'$0':'$'+Number(v).toExponential(2);
}
function fmtTok(v){
  if(v>=1e6)return nf(v/1e6,2)+'M';
  if(v>=1000)return nf(Math.round(v),0);
  return nf(v,v>=1?1:3);
}
const fmtBtc=v=>nf(v,v>=100?0:v>=1?3:4);
const pctCls=v=>v>0?'up':v<0?'down':'';
const signPct=v=>(v>0?'+':'')+nf(v,Math.abs(v)>=100?0:1)+'%';
function fmtDate(ms){
  const d=new Date(ms);
  return d.toLocaleDateString(lang==='zh'?'zh-CN':'en-GB',{year:'numeric',month:'short',day:'numeric'});
}
function fmtTime(ms){
  return new Date(ms).toLocaleTimeString(lang==='zh'?'zh-CN':'en-GB',{hour:'2-digit',minute:'2-digit'});
}

/* Try the direct API first, fall back to the same-origin rewrite in vercel.json
   so the page still works if a network blocks api.odin.fun outright. */
async function api(path){
  let last;
  for(const base of ODIN){
    try{
      const r=await fetch(base+path,{headers:{accept:'application/json'}});
      if(!r.ok){last=new Error(path+' HTTP '+r.status);continue;}
      return await r.json();
    }catch(e){last=e;}
  }
  throw last||new Error('fetch failed '+path);
}

function setLive(state,txt){
  const el=$('#live');
  el.className='live'+(state==='busy'?' busy':state==='fail'?' fail':'');
  $('#liveTxt').textContent=txt;
}

/* ================= load ================= */
async function load(){
  const ui=I18N[lang];
  setLive('busy',ui.liveBusy);
  const [set,tok,cur,own,liq]=await Promise.all([
    api('/settings'),api('/token/'+TOKEN),api('/currency/btc'),
    api('/token/'+TOKEN+'/owners?limit=1000'),api('/token/'+TOKEN+'/liquidity?limit=1000')
  ]);

  const btcUsd=Number(cur.amount)||0;
  const price=Number(tok.price)||0;                    // millisats per NOODL
  const supply=Number(tok.total_supply)/MS;
  const lpFeePct=Number(set.swap_lp_fee)/1000;         // settings are per-mille of a percent
  const created=Date.parse(tok.created_time);
  const bonded=tok.bonded_time?Date.parse(tok.bonded_time):null;

  const lpRows=liq.data||[];
  const lpTotal=lpRows.reduce((s,o)=>s+Number(o.balance),0);
  const lpBy={};lpRows.forEach(o=>{lpBy[o.user]=Number(o.balance)});

  const owners=(own.data||[]).map(o=>{
    const bal=Number(o.balance)/MS;
    const cost=Number(o.price)||0;
    return {
      user:o.user,name:o.user_username||o.user.slice(0,12),
      bal,share:supply?bal/supply*100:0,
      usd:bal*price/MS*btcUsd,
      cost,pnlUsd:bal*(price-cost)/MS*btcUsd,
      pnlPct:cost?(price/cost-1)*100:null,
      lpShare:lpTotal&&lpBy[o.user]?lpBy[o.user]/lpTotal*100:0
    };
  });

  S={set,tok,btcUsd,price,supply,lpFeePct,created,bonded,trades:null,owners,lpRows,lpTotal,
     poolBtc:Number(tok.btc_liquidity)/MS,vol24Btc:Number(tok.swap_volume_24)/MS,
     stamp:Date.now()};
  render();                                   // table is usable now, ~2s in
  setLive('ok',ui.liveOk(fmtTime(S.stamp)));

  /* The slow jobs run behind the table rather than in front of it: the whole
     trade feed is ~4800 records, the LP ledger is one request per provider and
     tenure is one per holder. None of them blocks first paint. */
  Promise.all([loadTrades(),loadLpLedger()]).then(()=>{computeLpEarnings();render();});
  loadPlatform();
  loadTenure();
}

async function loadTrades(){
  let trades=[];
  for(let pg=1;pg<=8;pg++){
    const d=await api('/token/'+TOKEN+'/trades?limit=1000&page='+pg);
    trades=trades.concat(d.data||[]);
    if(!d.data||!d.data.length||trades.length>=(d.count||0))break;
  }
  trades.sort((a,b)=>Date.parse(b.time)-Date.parse(a.time));
  S.trades=trades;
  buildHolderSeries();     // whichever of trades/tenure finishes last builds it
  render();
}

/* Mint and burn events for the pool's LP token. They are filed against the
   synthetic `lp_<token>` id rather than the token itself, so the plain token
   filter never returns them. Only current providers are fetched, which is a
   dozen requests rather than one per holder. */
async function loadLpLedger(){
  const evs={};
  await Promise.all(S.lpRows.map(async o=>{
    let all=[],pg=1,cnt=0;
    do{
      const d=await api('/user/'+o.user+'/activity?token=lp_'+TOKEN+'&limit=100&page='+pg);
      all=all.concat(d.data||[]);cnt=d.count||0;pg++;
    }while(all.length<cnt&&pg<8);
    evs[o.user]=all.map(a=>({
      t:Date.parse(a.time),
      d:(a.action==='ADD_LIQUIDITY'?1:-1)*Number(a.amount_token)
    })).sort((a,b)=>a.t-b.t);
  }));
  S.lpEvents=evs;
  /* Replaying every mint and burn should land on the balance the API reports.
     The balances and the event lists are fetched a second or two apart though,
     so a provider who moves in between leaves a real but harmless gap. The
     tolerance is therefore proportional: a rounding-scale drift is accepted,
     a ledger that is genuinely missing events is not, and in that case the
     column is withheld rather than shown as a number nobody can reproduce. */
  const supply=S.lpRows.reduce((s,o)=>s+Number(o.balance),0)||1;
  const drift=S.lpRows.reduce((s,o)=>
    s+Math.abs((evs[o.user]||[]).reduce((a,e)=>a+e.d,0)-Number(o.balance)),0);
  S.lpLedgerDrift=drift/supply;
  S.lpLedgerOk=S.lpLedgerDrift<0.005;
}

/* Fees are earned per swap in proportion to the share held at that moment, so
   they are accumulated by replaying every AMM swap against the reconstructed
   ledger, not by applying today's share to the whole history. Swaps landing
   while the reconstructed supply is zero stay unattributed rather than being
   handed to whoever happens to be present. */
function computeLpEarnings(){
  if(!S.trades||!S.lpEvents)return;
  const rate=S.lpFeePct/100;
  const evs=[];
  Object.keys(S.lpEvents).forEach(u=>S.lpEvents[u].forEach(e=>evs.push({t:e.t,u:u,d:e.d})));
  evs.sort((a,b)=>a.t-b.t);
  const swaps=S.trades.filter(t=>t.bonded)
    .map(t=>({t:Date.parse(t.time),btc:Number(t.amount_btc)}))
    .sort((a,b)=>a.t-b.t);

  const bal={},earn={};
  let total=0,unattributed=0,supply=0,ei=0;
  swaps.forEach(s=>{
    while(ei<evs.length&&evs[ei].t<=s.t){
      const e=evs[ei++];
      bal[e.u]=(bal[e.u]||0)+e.d;
      supply+=e.d;
    }
    const fee=s.btc*rate;
    total+=fee;
    if(supply<=0){unattributed+=fee;return;}
    for(const u in bal)if(bal[u]>0)earn[u]=(earn[u]||0)+fee*bal[u]/supply;
  });
  S.lpEarn=earn;
  S.lpFeeTotalBtc=total/MS;
  S.lpUnattributedBtc=unattributed/MS;
  S.lpSwapCount=swaps.length;
}

/* Platform-wide swap volume is summed from every token rather than read from
   the dashboard's `total_volume_all`, because that figure also contains
   bonding-curve turnover, which carries a different fee and no LP side. */
async function loadPlatform(){
  let all=[],pg=1,count=0;
  do{
    const d=await api('/tokens?limit=100&page='+pg);
    all=all.concat(d.data||[]);count=d.count||0;pg++;
  }while(all.length<count&&pg<60);
  S.plat={
    tokens:all.length,
    swapVolBtc:all.reduce((s,t)=>s+Number(t.swap_volume||0),0)/MS,
    totalVolBtc:all.reduce((s,t)=>s+Number(t.volume||0),0)/MS
  };
  render();
}

/* One activity request per holder. The endpoint caps limit at 100, so holders
   with a longer history need paging. Results are cached briefly, because this
   is by far the most expensive thing the page does to odin.fun. */
/* The key carries a version because each change to the cached shape would
   otherwise be read back as missing data rather than as a stale cache: v2 added
   firstAcq, v3 added the transfer list the holder-count line is built from. */
const TKEY='noodl_tenure_v3', TTL=20*60*1000;
async function loadTenure(){
  const ui=I18N[lang];
  try{
    const c=JSON.parse(localStorage.getItem(TKEY)||'null');
    if(c&&Date.now()-c.ts<TTL&&c.data&&c.xfers){
      tenure=c.data;xfers=c.xfers;tenureDone=true;
      buildHolderSeries();render();return;
    }
  }catch(e){}

  const users=S.owners.map(o=>o.user);
  const prog=$('#prog');prog.hidden=false;
  let done=0;
  const step=()=>{
    done++;
    $('#progTxt').textContent=ui.progress(done,users.length);
    $('#progBar').style.width=(done/users.length*100).toFixed(1)+'%';
  };
  for(let i=0;i<users.length;i+=12){
    const chunk=users.slice(i,i+12);
    await Promise.all(chunk.map(async u=>{
      try{
        const first=await api('/user/'+u+'/activity?token='+TOKEN+'&limit=100&page=1');
        let all=first.data||[];
        const pages=Math.ceil((first.count||0)/100);
        for(let pg=2;pg<=pages;pg++)
          all=all.concat((await api('/user/'+u+'/activity?token='+TOKEN+'&limit=100&page='+pg)).data||[]);
        const acq=[],sells=[];
        all.forEach(a=>{
          const t=Date.parse(a.time);
          if(a.action==='BUY'||a.action==='RECEIVE')acq.push(t);
          else if(a.action==='SELL')sells.push(t);
          // transfers are invisible in the trade feed, so they are kept here to
          // rebuild balances over time for the holder-count line
          if(a.action==='RECEIVE')xfers.push({t:t,u:u,d:Number(a.amount_token)});
          else if(a.action==='SEND')xfers.push({t:t,u:u,d:-Number(a.amount_token)});
        });
        const firstAcq=acq.length?Math.min.apply(null,acq):null;
        const lastSell=sells.length?Math.max.apply(null,sells):null;
        tenure[u]={
          // `since` is the holding clock and resets on a sell; `firstAcq` never
          // resets, because joining is a thing that happened once
          since:lastSell?Math.max(firstAcq||0,lastSell):firstAcq,
          firstAcq,
          lastSell
        };
      }catch(e){tenure[u]=null;}
      step();
    }));
    // repaint every fifth batch, not every batch: a full render rebuilds all
    // ~260 rows and the counter in the progress line already shows the motion
    if((i/12)%5===4)render();
  }
  tenureDone=true;prog.hidden=true;
  try{localStorage.setItem(TKEY,JSON.stringify({ts:Date.now(),data:tenure,xfers:xfers}));}catch(e){}
  buildHolderSeries();
  render();
}

/* Holder count over time. Buys and sells come from the trade feed, which covers
   every address that ever traded; transfers come from the per-holder activity,
   which only exists for addresses that still hold something. An address whose
   replayed history does not land on the balance the API reports for it is
   therefore missing events, and is dropped rather than allowed to drag a wrong
   shape through the whole curve. */
function buildHolderSeries(){
  // tenureDone is the gate, not xfers.length: the transfer list fills in over
  // several seconds, and building from a half-collected one paints a curve that
  // is visibly wrong until the rebuild lands
  if(!S||!S.trades||!tenureDone)return;
  const ev=[];
  S.trades.forEach(t=>ev.push({t:Date.parse(t.time),u:t.user,
    d:(t.buy?1:-1)*Number(t.amount_token)}));
  xfers.forEach(x=>ev.push(x));
  ev.sort((a,b)=>a.t-b.t);

  const net={};ev.forEach(e=>{net[e.u]=(net[e.u]||0)+e.d;});
  const cur={};S.owners.forEach(o=>{cur[o.user]=o.bal*MS;});
  const bad={};
  Object.keys(net).forEach(u=>{
    const want=cur[u]||0;
    if(Math.abs(net[u]-want)>Math.max(1e7,Math.abs(want)*0.02))bad[u]=1;
  });

  const DUST=1e6;                       // a rounding crumb is not a holder
  const bal={};let n=0;const pts=[];
  ev.forEach(e=>{
    if(bad[e.u])return;
    const was=(bal[e.u]||0)>DUST;
    bal[e.u]=(bal[e.u]||0)+e.d;
    const is=bal[e.u]>DUST;
    if(!was&&is)n++;else if(was&&!is)n--;
    pts.push({t:e.t,v:n});
  });
  S.holderSeries=pts;
  S.holderDropped=Object.keys(bad).length;
  S.holderSeen=Object.keys(net).length;
}

/* ================= derived ================= */
function heldDays(u){
  const t=tenure[u];
  if(!t||!t.since)return null;
  return (Date.now()-t.since)/DAY;
}
/* Reads the LP ledger, not the tenure feed: ADD_LIQUIDITY is filed under
   `lp_<token>`, so the token-filtered activity used for holding days never
   contained it and this returned null for every provider. */
function lpDays(u){
  const es=S&&S.lpEvents&&S.lpEvents[u];
  if(!es||!es.length)return null;
  return (Date.now()-es[0].t)/DAY;
}
function lpEarnedUsd(u){
  if(!S||!S.lpEarn||!S.lpLedgerOk)return null;
  const e=S.lpEarn[u];
  return e===undefined?null:e/MS*S.btcUsd;
}
/* How long ago this holder first showed up, ignoring anything they did since.
   Only current holders are visible to the API, so somebody who bought and fully
   exited inside the window is not counted here and never can be. */
function joinedDays(u){
  const t=tenure[u];
  if(!t||!t.firstAcq)return null;
  return (Date.now()-t.firstAcq)/DAY;
}
/* 30 days without a SELL, at any size. SEND is deliberately not a disqualifier:
   moving a position between your own addresses is not an exit, and heldDays
   already ignores it, so the title follows the holding clock exactly. */
function isNoodler(o){
  const d=heldDays(o.user);
  return d!==null&&d>=30;
}
function priceAgo(days){
  if(!S.trades)return undefined;               // feed still loading, distinct from "no trade that old"
  const cut=Date.now()-days*DAY;
  const t=S.trades.find(x=>Date.parse(x.time)<=cut);
  return t?Number(t.price):null;
}

/* ================= chart ================= */
const TFS=[['1m',60e3],['5m',300e3],['1h',36e5],['4h',144e5],['1d',864e5],['1w',6048e5]];
const BARS=110;                          // how many buckets a window shows

/* Close price per bucket, carried forward across empty ones so a quiet hour is
   a flat line rather than a gap. Prices come from the trade feed, whose
   `amount_btc` sums reconcile exactly with the token's reported volume. */
function priceBuckets(){
  const step=(TFS.find(x=>x[0]===tf)||TFS[2])[1];
  const trades=S.trades;if(!trades||!trades.length)return[];
  const now=Date.now();
  const end=Math.floor(now/step)*step;
  // never draw earlier than the token's first trade: at 1d and 1w the requested
  // window is longer than NOODL has existed, and carrying the opening price
  // backwards would invent a flat line across dates with no token on them
  const born=Math.floor(Date.parse(trades[trades.length-1].time)/step)*step;
  const start=Math.max(end-(BARS-1)*step,born);
  const close={};
  // trades arrive newest-first, so walking forward leaves the latest per bucket
  for(let i=trades.length-1;i>=0;i--){
    const t=trades[i],ts=Date.parse(t.time);
    if(ts<start-step*4)continue;
    close[Math.floor(ts/step)*step]=Number(t.price);
  }
  // seed the carry with the last price at or before the window
  let carry=null;
  for(let i=0;i<trades.length;i++){
    if(Date.parse(trades[i].time)<=start){carry=Number(trades[i].price);break;}
  }
  if(carry===null)carry=Number(trades[trades.length-1].price);
  const out=[];
  for(let b=start;b<=end;b+=step){
    if(close[b]!==undefined)carry=close[b];
    out.push({t:b,v:carry});
  }
  return out;
}

/* Traded BTC per bucket. Buys and sells both count, so this is turnover rather
   than net flow, and it sums to the token's reported volume over the whole
   history. Buckets with no trades are real zeroes, not carried forward. */
function volBuckets(px){
  const step=(TFS.find(x=>x[0]===tf)||TFS[2])[1];
  const sum={};
  S.trades.forEach(t=>{
    const b=Math.floor(Date.parse(t.time)/step)*step;
    sum[b]=(sum[b]||0)+Number(t.amount_btc);
  });
  return px.map(p=>({t:p.t,v:(sum[p.t]||0)/MS}));
}

/* Pool reserves follow the AMM's own invariant: with k = btc x tokens held
   across the window, the BTC side is btcNow * sqrt(p/pNow). Anchored on the
   live reserves this reproduces the ~0.2 BTC the pool was seeded with at
   bonding, which is the check that says the shape is real and not a rescaled
   copy of the price line. */
function poolSeries(px){
  const btcNow=S.poolBtc,pNow=S.price;
  if(!btcNow||!pNow)return[];
  return px.map(p=>({t:p.t,v:btcNow*Math.sqrt(p.v/pNow)*2}));
}

/* Step series sampled onto the price buckets. */
function sampleStep(series,px){
  if(!series||!series.length)return[];
  let i=0,v=series[0].v;
  return px.map(p=>{
    while(i<series.length&&series[i].t<=p.t){v=series[i].v;i++;}
    return {t:p.t,v:v};
  });
}

function fmtAxis(v,kind){
  if(kind==='mc')return fmtBtc(v)+' BTC';
  if(kind==='px')return fmtUsd(v);
  if(kind==='pool')return fmtBtc(v)+' BTC';
  return nf(v,0);
}

/* One renderer for all three panels. Draws into the SVG's own viewBox units so
   it never has to measure layout, which keeps it correct before first paint and
   after any resize. */
function drawSeries(svg,pts,opt){
  const W=800,H=svg===$('#cMain')?240:90,PAD=opt.pad||{t:10,r:52,b:16,l:6};
  if(!pts||pts.length<2){
    svg.innerHTML='<text class="cempty" x="12" y="'+(H/2)+'">'+esc(I18N[lang].cWait)+'</text>';
    return;
  }
  const xs=pts.map(p=>p.t),ys=pts.map(p=>p.v);
  let lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  if(hi===lo){hi=lo+(Math.abs(lo)||1)*0.02;lo=lo-(Math.abs(lo)||1)*0.02;}
  const padY=(hi-lo)*0.12;lo-=padY;hi+=padY;
  const x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  const X=t=>PAD.l+(x1===x0?0:(t-x0)/(x1-x0))*(W-PAD.l-PAD.r);
  const Y=v=>PAD.t+(1-(v-lo)/(hi-lo))*(H-PAD.t-PAD.b);
  const gold=opt.gold?' gold':'';
  const gid='g'+opt.key;
  let d='';pts.forEach((p,i)=>{d+=(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1);});
  const area=d+'L'+X(x1).toFixed(1)+' '+(H-PAD.b)+'L'+X(x0).toFixed(1)+' '+(H-PAD.b)+'Z';
  const c=opt.gold?'252,209,79':'0,255,255';
  let g='';
  const ticks=svg===$('#cMain')?4:2;
  for(let i=0;i<=ticks;i++){
    const v=lo+(hi-lo)*i/ticks,y=Y(v).toFixed(1);
    g+='<line class="cgrid" x1="'+PAD.l+'" x2="'+(W-PAD.r)+'" y1="'+y+'" y2="'+y+'"/>'
      +'<text class="clab" x="'+(W-PAD.r+6)+'" y="'+(+y+3)+'">'+esc(fmtAxis(v,opt.key))+'</text>';
  }
  svg.innerHTML=
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="rgba('+c+',.22)"/>'
    +'<stop offset="1" stop-color="rgba('+c+',0)"/></linearGradient></defs>'
    +g
    +'<path class="carea" fill="url(#'+gid+')" d="'+area+'"/>'
    +'<path class="cline'+gold+'" d="'+d+'"/>'
    +'<g id="'+gid+'h"></g>';
  svg.__geo={X:X,Y:Y,pts:pts,gold:opt.gold,key:opt.key,W:W,H:H,PAD:PAD};
}

/* Volume histogram. It reuses the price panel's left/right padding so every bar
   lands under the point it belongs to, and colours each bar by whether that
   bucket closed above or below the one before it. */
function drawVolume(vol,px){
  const svg=$('#cVol');if(!svg)return;
  const W=800,H=64,PAD={t:6,r:52,b:2,l:6};
  if(!vol||!vol.length){svg.innerHTML='';svg.__geo=null;return;}
  const hi=Math.max.apply(null,vol.map(v=>v.v))||1;
  const n=vol.length;
  const span=(W-PAD.l-PAD.r);
  const bw=Math.max(1,span/n*0.62);
  const X=t=>{
    const x0=vol[0].t,x1=vol[n-1].t;
    return PAD.l+(x1===x0?0:(t-x0)/(x1-x0))*span;
  };
  let bars='';
  vol.forEach((v,i)=>{
    const h=v.v/hi*(H-PAD.t-PAD.b);
    if(h<=0)return;
    const up=i===0||px[i].v>=px[i-1].v;
    bars+='<rect class="cbar '+(up?'up':'down')+'" x="'+(X(v.t)-bw/2).toFixed(1)
      +'" y="'+(H-PAD.b-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'"/>';
  });
  svg.innerHTML=bars
    +'<text class="clab" x="'+(W-PAD.r+6)+'" y="'+(PAD.t+7)+'">'+esc(fmtBtc(hi)+' BTC')+'</text>'
    +'<g id="gvolh"></g>';
  svg.__geo={X:X,pts:vol,W:W,H:H,PAD:PAD,key:'vol'};
}

function drawChart(){
  const ui=I18N[lang];
  if(!S||!S.trades){
    [$('#cMain'),$('#cHold'),$('#cPool')].forEach(s=>{
      if(s)s.innerHTML='<text class="cempty" x="12" y="'+(s===$('#cMain')?120:45)+'">'+esc(ui.cWait)+'</text>';
    });
    return;
  }
  const px=priceBuckets();
  const main=metric==='mc'
    ? px.map(p=>({t:p.t,v:p.v/MS*S.supply}))
    : px.map(p=>({t:p.t,v:p.v/MS*S.btcUsd}));
  const vol=volBuckets(px);
  S.chartPx=px;S.chartVol=vol;
  drawSeries($('#cMain'),main,{key:metric==='mc'?'mc':'px'});
  drawVolume(vol,px);
  drawSeries($('#cPool'),poolSeries(px),{key:'pool',gold:true});
  drawSeries($('#cHold'),sampleStep(S.holderSeries,px),{key:'hold'});

  const last=main[main.length-1],first=main[0];
  const ch=first&&first.v?(last.v-first.v)/first.v*100:0;
  $('#cRead').innerHTML='<b>'+esc(fmtAxis(last.v,metric==='mc'?'mc':'px'))+'</b> '
    +'<span class="'+pctCls(ch)+'">'+esc(signPct(ch))+'</span> · '+esc(ui.tfWindow(tf,main.length));
  const hs=S.holderSeries;
  $('#cHoldNow').textContent=hs&&hs.length?nf(hs[hs.length-1].v,0):'…';
  $('#cPoolNow').textContent=fmtBtc(S.poolBtc*2)+' BTC';
}

/* Hover readout: nearest bucket by x, drawn into the panel's own overlay group.
   Price and volume are one reading split across two panels, so pointing at
   either draws the crosshair on both and the readout names both numbers. */
function chartHover(svg,ev){
  const geo=svg.__geo;if(!geo)return;
  const r=svg.getBoundingClientRect();
  const vx=(ev.clientX-r.left)/r.width*geo.W;
  let bi=-1,bd=1e9;
  geo.pts.forEach((p,i)=>{const d=Math.abs(geo.X(p.t)-vx);if(d<bd){bd=d;bi=i;}});
  if(bi<0)return;
  const best=geo.pts[bi];
  const g=svg.querySelector('g[id$="h"]');
  if(g){
    const x=geo.X(best.t).toFixed(1);
    let mark='<line class="cx" x1="'+x+'" x2="'+x+'" y1="'+geo.PAD.t+'" y2="'+(geo.H-geo.PAD.b)+'"/>';
    if(geo.Y)mark+='<circle class="cdot'+(geo.gold?' gold':'')+'" cx="'+x
      +'" cy="'+geo.Y(best.v).toFixed(1)+'" r="3.5"/>';
    g.innerHTML=mark;
  }
  // mirror the crosshair onto the paired panel
  const other=svg===$('#cMain')?$('#cVol'):(svg===$('#cVol')?$('#cMain'):null);
  if(other&&other.__geo&&other.__geo.pts[bi]){
    const og=other.__geo,op=og.pts[bi],ox=og.X(op.t).toFixed(1);
    const oh=other.querySelector('g[id$="h"]');
    if(oh){
      let m='<line class="cx" x1="'+ox+'" x2="'+ox+'" y1="'+og.PAD.t+'" y2="'+(og.H-og.PAD.b)+'"/>';
      if(og.Y)m+='<circle class="cdot" cx="'+ox+'" cy="'+og.Y(op.v).toFixed(1)+'" r="3.5"/>';
      oh.innerHTML=m;
    }
  }
  if(svg===$('#cMain')||svg===$('#cVol')){
    const ui=I18N[lang];
    const pxPt=svg===$('#cMain')?best:($('#cMain').__geo?$('#cMain').__geo.pts[bi]:null);
    const vPt=S.chartVol&&S.chartVol[bi];
    let s='';
    if(pxPt)s+='<b>'+esc(fmtAxis(pxPt.v,metric==='mc'?'mc':'px'))+'</b>';
    if(vPt)s+=(s?' · ':'')+esc(ui.volLabel)+' '+esc(fmtBtc(vPt.v)+' BTC');
    $('#cRead').innerHTML=s+' · '+esc(fmtStamp(best.t));
  }
}
function chartLeave(svg){
  [svg,svg===$('#cMain')?$('#cVol'):$('#cMain')].forEach(s=>{
    const g=s&&s.querySelector('g[id$="h"]');if(g)g.innerHTML='';
  });
  drawChart();
}
function fmtStamp(t){
  const d=new Date(t),z=n=>String(n).padStart(2,'0');
  const day=d.toLocaleDateString(lang==='zh'?'zh-CN':'en-GB',{month:'short',day:'numeric'});
  return (tf==='1d'||tf==='1w')?day:day+' '+z(d.getHours())+':'+z(d.getMinutes());
}

/* ================= render ================= */
function statHtml(label,value,sub,cls,note){
  return '<div class="stat'+(cls?' '+cls:'')+'">'
    +'<div class="stat-l">'+esc(label)+'</div>'
    +'<div class="stat-v">'+value+'</div>'
    +(sub?'<div class="stat-s">'+sub+'</div>':'')
    +(note?'<div class="stat-n">'+esc(note)+'</div>':'')+'</div>';
}

function render(){
  const ui=I18N[lang];
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i]').forEach(el=>{
    const v=ui[el.dataset.i];if(typeof v==='string')el.textContent=v;
  });
  $('#langBtn').textContent=lang==='en'?'中文':'EN';
  $('#q').placeholder=ui.search;
  $('#how').innerHTML=ui.how.map(h=>'<li>'+h+'</li>').join('');
  $('#segMetric').innerHTML=[['mc',ui.mc],['px',ui.price]].map(m=>
    '<button type="button" data-m="'+m[0]+'" aria-pressed="'+(metric===m[0])+'">'+esc(m[1])+'</button>').join('');
  $('#segTf').innerHTML=TFS.map(t=>
    '<button type="button" data-t="'+t[0]+'" aria-pressed="'+(tf===t[0])+'">'+esc(ui.tf[t[0]])+'</button>').join('');
  document.querySelectorAll('.sort').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===sort)));
  $('#thead').innerHTML=ui.th.map(h=>'<th>'+esc(h)+'</th>').join('');
  drawChart();
  if(!S)return;

  /* --- market --- */
  const mcBtc=Number(S.tok.marketcap)/MS;
  let m=statHtml(ui.mc,fmtBtc(mcBtc)+' <span class="cy">BTC</span>',fmtUsd(mcBtc*S.btcUsd));
  m+=statHtml(ui.price,fmtUsd(S.price/MS*S.btcUsd),(S.price/MS).toExponential(3)+' BTC');
  [[1,'d1'],[7,'d7'],[30,'d30']].forEach(([d,k])=>{
    const was=priceAgo(d);
    if(was===undefined){m+=statHtml(ui[k],'<span class="pend">…</span>');return;}
    if(was===null||!was){m+=statHtml(ui[k],'<span class="pend">'+ui.noData+'</span>','',null,ui.tokenAge(((Date.now()-S.created)/DAY).toFixed(0)));return;}
    const pct=(S.price-was)/was*100;
    m+=statHtml(ui[k],'<span class="'+pctCls(pct)+'">'+signPct(pct)+'</span>',
      fmtUsd(was/MS*S.btcUsd)+' → '+fmtUsd(S.price/MS*S.btcUsd),null,
      d===30&&S.bonded&&Date.now()-30*DAY<S.bonded?(lang==='zh'?'跨越 '+fmtDate(S.bonded)+' 毕业前':'spans pre-bonding, '+fmtDate(S.bonded)):null);
  });
  $('#gMarket').innerHTML=m;

  /* --- holders --- */
  const tokenAgeD=(Date.now()-S.created)/DAY;
  let h=statHtml(ui.holders,nf(S.owners.length,0),
    lang==='zh'?'币龄 '+nf(tokenAgeD,1)+' 天':nf(tokenAgeD,1)+' days old');
  [100,500,1000].forEach(t=>{
    const n=S.owners.filter(o=>o.usd>t).length;
    h+=statHtml(ui.over(nf(t,0)),nf(n,0),
      S.owners.length?nf(n/S.owners.length*100,0)+'%':'');
  });
  [1,30,60].forEach(d=>{
    const n=S.owners.filter(o=>{const x=joinedDays(o.user);return x!==null&&x<=d}).length;
    h+=statHtml(ui.newIn(d),
      tenureDone||n?nf(n,0):'<span class="pend">…</span>',
      tenureDone&&S.owners.length?ui.ofTotal(nf(n/S.owners.length*100,0)):'');
  });
  [30,60].forEach(d=>{
    const possible=tokenAgeD>=d;
    const n=S.owners.filter(o=>{const x=heldDays(o.user);return x!==null&&x>=d}).length;
    h+=statHtml(ui.heldN(d),
      possible?(tenureDone||n?nf(n,0):'<span class="pend">…</span>'):'<span class="pend">0</span>',
      // the 30-day bucket and the NOODLER roll are now the same set, so name the
      // equivalence instead of printing the identical number twice
      possible&&d===30?ui.eqNoodler:'',
      possible?null:'pending',
      possible?null:ui.notYet(fmtDate(S.created+d*DAY)));
  });
  $('#gHolders').innerHTML=h;

  /* --- pool --- */
  const poolValBtc=S.poolBtc*2;                       // BTC side plus the token side at parity
  const lpFee24=S.vol24Btc*(S.lpFeePct/100);
  const apy=poolValBtc?lpFee24/poolValBtc*365*100:0;
  const poolAgeD=S.bonded?(Date.now()-S.bonded)/DAY:0;
  let p=statHtml(ui.poolSize,fmtBtc(poolValBtc)+' <span class="cy">BTC</span>',
    fmtUsd(poolValBtc*S.btcUsd)+' · '+nf(mcBtc?poolValBtc/mcBtc*100:0,1)+'%');
  p+=statHtml(ui.vol24,fmtBtc(S.vol24Btc)+' <span class="cy">BTC</span>',fmtUsd(S.vol24Btc*S.btcUsd));
  // both halves come from /settings, so the total cannot drift out of step with
  // the platform's own numbers the way a hardcoded one would
  const platFeePct=Number(S.set.swap_platform_fee)/1000;
  const totFeePct=platFeePct+S.lpFeePct;
  p+=statHtml(ui.lpFee,nf(S.lpFeePct,1)+'%',
    lang==='zh'?'平台 '+nf(platFeePct,1)+'%，合计 '+nf(totFeePct,1)+'%'
               :'platform '+nf(platFeePct,1)+'%, '+nf(totFeePct,1)+'% total');
  p+=statHtml(ui.apy,'<span class="'+(apy>0?'up':'')+'">'+nf(apy,1)+'%</span>',
    fmtBtc(lpFee24)+' BTC / '+(lang==='zh'?'天':'day'),null,
    lang==='zh'?'按过去 24 小时简单年化':'simple, from the last 24h');
  p+=statHtml(ui.chefs,nf(S.lpRows.length,0),
    lang==='zh'?'池龄 '+nf(poolAgeD,1)+' 天':nf(poolAgeD,1)+' days old');
  [30,60].forEach(d=>{
    const possible=poolAgeD>=d;
    const n=S.owners.filter(o=>{const x=lpDays(o.user);return x!==null&&x>=d}).length;
    p+=statHtml(ui.lpHeld(d),
      possible?(S.lpEvents||n?nf(n,0):'<span class="pend">…</span>'):'<span class="pend">0</span>','',
      possible?null:'pending',
      possible||!S.bonded?null:ui.notYet(fmtDate(S.bonded+d*DAY)));
  });
  $('#gPool').innerHTML=p;

  /* --- fees earned to date --- */
  const platPct=Number(S.set.swap_platform_fee)/1000/100;
  const noodlSwapBtc=Number(S.tok.swap_volume)/MS;
  const noodlLpBtc=noodlSwapBtc*(S.lpFeePct/100);
  const noodlPlatBtc=noodlSwapBtc*platPct;
  let f=statHtml(ui.swapVolAll,fmtBtc(noodlSwapBtc)+' <span class="cy">BTC</span>',
    fmtUsd(noodlSwapBtc*S.btcUsd)+(S.lpSwapCount?' · '+nf(S.lpSwapCount,0)+ui.swaps:''));
  f+=statHtml(ui.lpEarnedAll,'<span class="up">'+fmtUsd(noodlLpBtc*S.btcUsd)+'</span>',
    fmtBtc(noodlLpBtc)+' BTC',null,
    S.lpUnattributedBtc>0&&noodlLpBtc?ui.unattributed(nf(S.lpUnattributedBtc/noodlLpBtc*100,1)):null);
  f+=statHtml(ui.platFromNoodl,fmtUsd(noodlPlatBtc*S.btcUsd),
    fmtBtc(noodlPlatBtc)+' BTC · '+nf(platPct*100,1)+'%');
  f+=S.plat
    ? statHtml(ui.platAll,fmtUsd(S.plat.swapVolBtc*platPct*S.btcUsd),
        fmtBtc(S.plat.swapVolBtc)+ui.swapped+nf(S.plat.swapVolBtc?noodlSwapBtc/S.plat.swapVolBtc*100:0,1)+'%',
        null,ui.swapOnly)
    : statHtml(ui.platAll,'<span class="pend">…</span>');
  $('#gFees').innerHTML=f;

  /* --- table --- */
  const q=query.trim().toLowerCase();
  let rows=S.owners.filter(o=>!q||o.name.toLowerCase().includes(q)||o.user.toLowerCase().includes(q));
  const key={bal:o=>o.bal,pnl:o=>o.pnlUsd,held:o=>heldDays(o.user)==null?-1:heldDays(o.user),
             lp:o=>o.lpShare,lpe:o=>lpEarnedUsd(o.user)||0}[sort];
  rows=rows.slice().sort((a,b)=>key(b)-key(a));
  $('#count').textContent=ui.count(rows.length,S.owners.length);

  const maxShare=S.owners.reduce((m,o)=>Math.max(m,o.share),0)||1;
  $('#rows').innerHTML=rows.map((o,i)=>{
    const d=heldDays(o.user);
    const earn=lpEarnedUsd(o.user);
    const tags=(isNoodler(o)?'<span class="tag noodler">NOODLER</span>':'')
              +(o.lpShare>0?'<span class="tag chef">CHEF</span>':'');
    return '<tr>'
      +'<td>'+(i+1)+'</td>'
      +'<td><div class="who"><span class="av" aria-hidden="true">'+esc((o.name.trim()[0]||'?').toUpperCase())+'</span>'
        +'<span class="nm"><a href="https://odin.fun/user/'+esc(o.user)+'" target="_blank" rel="noopener">'+esc(o.name)+'</a></span></div></td>'
      +'<td>'+fmtTok(o.bal)+'</td>'
      +'<td><span class="shr">'+nf(o.share,3)+'%<i style="width:'+(o.share/maxShare*48).toFixed(1)+'px"></i></span></td>'
      +'<td>'+fmtUsd(o.usd)+'</td>'
      +'<td>'+(o.cost?fmtUsd(o.cost/MS*S.btcUsd):'<span class="pend">'+ui.noData+'</span>')+'</td>'
      +'<td class="'+pctCls(o.pnlUsd)+'">'+(o.pnlUsd>=0?'+':'−')+fmtUsd(Math.abs(o.pnlUsd)).replace('$','$')
        +(o.pnlPct===null?'':' <span class="stat-s">'+signPct(o.pnlPct)+'</span>')+'</td>'
      +'<td>'+(d===null?'<span class="pend">'+(tenureDone?ui.noData:'…')+'</span>':ui.days(nf(d,0)))+'</td>'
      // the pool columns stay empty for everyone outside the pool: a dash there
      // reads as a missing reading rather than as "does not apply"
      +'<td>'+(o.lpShare?nf(o.lpShare,2)+'%':'')+'</td>'
      +'<td>'+(!o.lpShare?'':earn===null?'<span class="pend">…</span>'
              :'<span class="up">'+fmtUsd(earn)+'</span>')+'</td>'
      +'<td><span class="tags">'+(tags||'<span class="pend">'+ui.noData+'</span>')+'</span></td>'
      +'</tr>';
  }).join('');
}

/* ================= events ================= */
$('#segMetric').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;metric=b.dataset.m;render();
});
$('#segTf').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;tf=b.dataset.t;render();
});
[$('#cMain'),$('#cVol'),$('#cHold'),$('#cPool')].forEach(svg=>{
  svg.addEventListener('pointermove',e=>chartHover(svg,e));
  svg.addEventListener('pointerleave',()=>chartLeave(svg));
});
document.querySelectorAll('.sort').forEach(b=>b.addEventListener('click',()=>{sort=b.dataset.s;render();}));
$('#q').addEventListener('input',e=>{query=e.target.value;render();});
$('#langBtn').addEventListener('click',()=>{
  lang=lang==='en'?'zh':'en';
  try{localStorage.setItem('noodl_lang',lang);}catch(e){}
  render();
  if(S)setLive('ok',I18N[lang].liveOk(fmtTime(S.stamp)));
});

render();
load().catch(e=>{
  console.error(e);
  setLive('fail',I18N[lang].liveFail);
  $('#err').innerHTML='<div class="err">'+esc(I18N[lang].errLoad)+'</div>';
});
</script>
