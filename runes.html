<script>/* Theme before first paint: a stored choice wins; otherwise the visitor's
   clock decides (07:00–19:00 is day). One delegated listener serves the toggle. */
(function(){var t=null;try{t=localStorage.getItem('noodl_theme');}catch(e){}
if(t!=='day'&&t!=='night'){var h=new Date().getHours();t=(h>=7&&h<19)?'day':'night';}
document.documentElement.setAttribute('data-theme',t);
document.addEventListener('click',function(e){
  var b=e.target&&e.target.closest?e.target.closest('#themeBtn'):null;if(!b)return;
  var n=document.documentElement.getAttribute('data-theme')==='day'?'night':'day';
  document.documentElement.setAttribute('data-theme',n);
  try{localStorage.setItem('noodl_theme',n);}catch(e2){}});})();</script>

  mineSum:'{n} 个持仓里，有 {k} 个现在就能跨到比特币主网。',
  foot:'零托管：本页只读 odin.fun 公开 API、只链接官方界面——永远不会向你要密钥、签名或转账。Omnity 停运不会困住 odin 的符文：canister 本身就是桥，「跨出」通道一直开着。数据来源 api.odin.fun，每次访问实时刷新。',
  copied:'已复制'
}};
let lang;try{const s=localStorage.getItem('noodl_lang');if(s==='en'||s==='zh')lang=s;}catch(e){}
if(!lang)lang=(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en';
function ui(){return I18N[lang];}
/* keys whose value carries inline <b>: set as HTML (authored here, never user data) */
const RICH=/^(out1|out2|in1|in2|in3)$/;
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  const u=ui();
  document.querySelectorAll('[data-i]').forEach(el=>{
    const v=u[el.dataset.i];if(typeof v!=='string')return;
    if(RICH.test(el.dataset.i))el.innerHTML=v;else el.textContent=v;
  });
  document.querySelectorAll('[data-i-ph]').forEach(el=>{
    const v=u[el.dataset.iPh];if(typeof v==='string')el.placeholder=v;
  });
  $('#langBtn').textContent=lang==='en'?'中文':'EN';
  paintAll();
}
$('#langBtn').addEventListener('click',()=>{
  lang=lang==='en'?'zh':'en';
  try{localStorage.setItem('noodl_lang',lang);}catch(e){}
  applyLang();
});

/* ================= stars ================= */
(function(){
  const box=$('#stars'),colors=['#f4ead0','#f5a86a','#8fd0c8','#ffffff'];
  for(let i=0;i<46;i++){
    const s=document.createElement('i');
    const z=Math.random()*2+1;
    s.style.cssText='left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;width:'+z+'px;height:'+z+'px;'
      +'background:'+colors[i%colors.length]+';animation-duration:'+(2.5+Math.random()*4)+'s;animation-delay:-'+(Math.random()*4)+'s';
    box.appendChild(s);
  }
})();

/* ================= api ================= */
const API_D='https://api.odin.fun/v2',API_P='/api/odin';
async function api(path){
  try{
    const r=await fetch(API_D+path,{cache:'no-store'});
    if(r.ok)return await r.json();
  }catch(e){}
  const r2=await fetch(API_P+path,{cache:'no-store'});
  if(!r2.ok)throw new Error('api '+r2.status);
  return r2.json();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtN(n){return Number(n).toLocaleString('en-US');}

/* ================= state ================= */
const S={noodl:null,stats:null,found:null,mine:null,mineWho:null,mineErr:false};

/* ---- one token's channel card. The card never invents a state: every light
   is that token's own flags as odin serves them this minute. ---- */
function gateHtml(t){
  const u=ui();
  const hasRune=!!t.rune;
  const out=hasRune&&!!t.withdrawals, back=hasRune&&!!t.deposits;
  const runeLine=hasRune
    ?'<span class="rune" data-copy="'+esc(t.rune)+'">'+esc(t.rune)+' · '+esc(t.rune_id||'')+'</span>'
    :'';
  let links='';
  if(hasRune){
    const enc=encodeURIComponent(t.rune);
    links='<div class="linkrow">'
      +'<a href="https://ordiscan.com/rune/'+enc+'" target="_blank" rel="noopener">Ordiscan ↗</a>'
      +'<a href="https://magiceden.io/runes/'+enc+'" target="_blank" rel="noopener">Magic Eden ↗</a>'
      +'<a href="https://odin.fun/token/'+esc(t.id)+'" target="_blank" rel="noopener">odin.fun ↗</a>'
      +'</div>';
  }
  return '<div class="head"><b>'+esc(t.ticker||t.name||t.id)+'</b>'+runeLine+'</div>'
    +'<div class="gates">'
    +'<div class="gate '+(out?'open':'closed')+'"><div class="g-t"><span class="dot '+(out?'ok':'no')+'"></span>'+esc(u.gateOut)+'</div>'
      +'<div class="g-s">'+esc(hasRune?(out?u.gOpen:u.gClosed):u.gNoRune)+'</div></div>'
    +'<div class="gate '+(back?'open':'closed')+'"><div class="g-t"><span class="dot '+(back?'ok':'no')+'"></span>'+esc(u.gateIn)+'</div>'
      +'<div class="g-s">'+esc(hasRune?(back?u.gOpen:u.gInClosedAll):u.gNoRune)+'</div></div>'
    +'</div>'+links;
}
function paintNoodl(){
  const u=ui(),el=$('#noodlCard');
  if(!S.noodl){el.innerHTML='<div class="loadline">'+esc(u.loading)+'</div>';return;}
  let h=gateHtml(S.noodl);
  if(S.stats)h+='<div class="statline">'+esc(u.statTpl
      .replace('{n}',S.stats.n).replace('{w}',S.stats.w)
      .replace('{d}',S.stats.d).replace('{ib}',fmtN(S.stats.ib)))+'</div>';
  el.innerHTML=h;
}
function paintFound(){
  const u=ui(),el=$('#srchOut');
  if(S.found===null){el.innerHTML='';return;}
  if(S.found===false){el.innerHTML='<div class="miss">'+esc(u.miss.replace('{q}',S.foundQ||''))+'</div>';return;}
  el.innerHTML='<div class="chan">'+gateHtml(S.found)+'</div>';
}
function paintIn(){
  /* the "back" guide's status dot follows the live platform truth */
  const dot=$('#inDot');
  if(!S.stats){dot.className='dot wait';return;}
  dot.className='dot '+(S.stats.d>0?'ok':'no');
}
function paintMine(){
  const u=ui(),el=$('#mineOut');
  if(S.mine===null&&!S.mineErr){el.hidden=true;return;}
  el.hidden=false;
  if(S.mineErr){el.innerHTML='<div class="loadline">'+esc(u.miss.replace('{q}',S.mineWho||''))+'</div>';return;}
  if(S.mine==='loading'){el.innerHTML='<div class="loadline">'+esc(u.mineLoad)+'</div>';return;}
  if(!S.mine.length){el.innerHTML='<div class="loadline">'+esc(u.mineNone)+'</div>';return;}
  const k=S.mine.filter(r=>r.go).length;
  el.innerHTML=S.mine.map(r=>'<div class="mrow"><b>'+esc(r.tk)+'</b>'
      +'<span class="bal">'+esc(r.bal)+'</span>'
      +'<span class="r">'+esc(r.rune||'—')+'</span>'
      +'<span class="tag '+(r.go?'ok':'no')+'">'+esc(r.go?u.canGo:u.cantGo)+'</span></div>').join('')
    +'<div class="loadline">'+esc(u.mineSum.replace('{n}',S.mine.length).replace('{k}',k))+'</div>';
}
function paintAll(){paintNoodl();paintFound();paintIn();paintMine();}

/* ================= loaders ================= */
async function boot(){
  try{
    const [tok,list,st]=await Promise.all([
      api('/token/hjrg'),
      api('/tokens?sort=marketcap%3Adesc&limit=60'),
      api('/settings')
    ]);
    S.noodl=tok;
    const rows=(list&&list.data)||[];
    S.stats={n:rows.length,
      w:rows.filter(t=>t.rune&&t.withdrawals).length,
      d:rows.filter(t=>t.rune&&t.deposits).length,
      ib:Number(st&&st.last_indexed_block)||0};
  }catch(e){}
  paintAll();
}
async function findToken(){
  const q=($('#q').value||'').trim();
  if(!q)return;
  const btn=$('#qGo');btn.disabled=true;
  S.foundQ=q;
  try{
    let hit=null;
    /* odin ids are 4 lowercase chars — try the direct road first */
    if(/^[a-z0-9]{4,6}$/.test(q.toLowerCase())){
      try{hit=await api('/token/'+encodeURIComponent(q.toLowerCase()));}catch(e){}
      if(hit&&!hit.id)hit=null;
    }
    if(!hit){
      const j=await api('/tokens?search='+encodeURIComponent(q)+'&limit=6');
      const rows=(j&&j.data)||[];
      const ql=q.toLowerCase();
      hit=rows.find(t=>(t.ticker||'').toLowerCase()===ql)
        ||rows.find(t=>(t.name||'').toLowerCase()===ql)
        ||rows[0]||null;
    }
    S.found=hit||false;
  }catch(e){S.found=false;}
  btn.disabled=false;
  paintFound();
}
function parseWho(v){
  v=(v||'').trim();
  const m=v.match(/user\/([a-z0-9-]+)/i);
  if(m)return m[1];
  return /^[a-z0-9-]{20,80}$/i.test(v)?v:null;
}
async function lookupMine(){
  const p=parseWho($('#who').value);
  const u=ui(),btn=$('#whoGo');
  S.mineErr=false;
  if(!p){S.mineErr=true;S.mineWho=$('#who').value;paintMine();return;}
  btn.disabled=true;
  S.mine='loading';S.mineWho=p;paintMine();
  try{
    const j=await api('/user/'+encodeURIComponent(p)+'/tokens?sort=holding_value%3Adesc&limit=30');
    const rows=(j&&j.data)||[];
    S.mine=rows.filter(r=>r.token&&r.token.id!=='btc').map(r=>{
      const t=r.token;
      const bal=Number(r.balance)||0;
      return {tk:t.ticker||t.name||t.id,rune:t.rune||'',
        bal:(bal/1e11).toLocaleString('en-US',{maximumFractionDigits:0}),
        go:!!(t.rune&&t.withdrawals)};
    });
  }catch(e){S.mine=null;S.mineErr=true;}
  btn.disabled=false;
  paintMine();
}
$('#qGo').addEventListener('click',findToken);
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')findToken();});
$('#whoGo').addEventListener('click',lookupMine);
$('#who').addEventListener('keydown',e=>{if(e.key==='Enter')lookupMine();});
document.addEventListener('click',e=>{
  const c=e.target.closest?e.target.closest('[data-copy]'):null;
  if(!c)return;
  try{navigator.clipboard.writeText(c.dataset.copy);}catch(err){}
  const old=c.textContent;c.textContent=ui().copied;
  setTimeout(()=>{c.textContent=old;},900);
});

applyLang();
boot();
/* the ?scan= convention other pages use: prefill and run the wallet check */
try{
  const qs=new URLSearchParams(location.search).get('scan');
  if(qs){$('#who').value=qs;lookupMine();}
}catch(e){}
</script>
